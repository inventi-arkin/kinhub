                               <Mail size={14} className="text-indigo-400" /> <span className="text-[11px] font-bold truncate text-slate-700">{selUser.email || 'No email provided'}</span>
                             </div>
                             <div className="flex items-center gap-4 text-slate-500 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
                               <Phone size={14} className="text-indigo-400" /> <span className="text-[11px] font-bold text-slate-700">{selUser.contact || 'No contact provided'}</span>
                             </div>
                           </div>
                         </div>
                       );
                     })()}
                   </div>
                 )}

                 {/* Team Roster Modal Overlay */}
                 {showUserList && (
                    <div className="absolute inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 sm:p-8 animate-in fade-in" onClick={() => setShowUserList(false)}>
                       <div className="bg-white w-full max-w-4xl max-h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                          <div className="p-8 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 gap-4">
                             <div>
                                <h2 className="text-2xl font-black text-slate-800">Office Overview</h2>
                                <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Directory & Attendance</p>
                             </div>
                             <div className="flex items-center gap-3">
                                <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest hidden sm:block">Group By:</span>
                                <select 
                                  value={rosterGroupBy} 
                                  onChange={(e) => { setRosterGroupBy(e.target.value); setExpandedRosterUser(null); }}
                                  className="bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none cursor-pointer shadow-sm focus:border-indigo-300 transition-colors"
                                >
                                   <option value="none">None</option>
                                   <option value="status">Work Status</option>
                                   <option value="project">Project</option>
                                </select>
                                <button onClick={() => setShowUserList(false)} className="ml-2 p-2 bg-white rounded-full text-slate-400 hover:text-slate-800 shadow-sm border border-slate-200 transition-colors"><X size={16}/></button>
                             </div>
                          </div>
                          <div className="p-8 overflow-y-auto space-y-10">
                             {rosterGroupBy === 'none' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                   {directory.sort((a,b) => (a.displayName || 'Kin').localeCompare(b.displayName || 'Kin')).map(member => renderMemberRow(member))}
                                </div>
                             )}

                             {rosterGroupBy === 'status' && WORK_STATUSES.map(status => {
                                const members = directory.filter(u => getEffectiveStatus(u) === status.id).sort((a,b) => (a.displayName || 'Kin').localeCompare(b.displayName || 'Kin'));
                                if(members.length === 0) return null;
                                const StatusIcon = status.icon;
                                return (
                                   <div key={status.id}>
                                      <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-3">
                                         <div className={`p-2 rounded-xl ${status.id === 'mia' ? 'bg-rose-50 text-rose-600' : status.id === 'break' ? 'bg-orange-50 text-orange-600' : 'bg-indigo-50 text-indigo-600'}`}><StatusIcon size={18} /></div>
                                         <h3 className="text-sm font-black uppercase text-slate-700 tracking-widest">{status.label} <span className="text-slate-400 ml-2">({members.length})</span></h3>
                                      </div>
                                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                         {members.map(member => renderMemberRow(member))}
                                      </div>
                                   </div>
                                );
                             })}

                             {rosterGroupBy === 'project' && [{id: '', name: 'Open Work / Unassigned'}, ...projects].map(proj => {
                                const members = directory.filter(u => (u.activeProject || '') === proj.id).sort((a,b) => (a.displayName || 'Kin').localeCompare(b.displayName || 'Kin'));
                                if(members.length === 0) return null;
                                return (
                                   <div key={proj.id}>
                                      <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-3">
                                         <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl"><FolderKanban size={18} /></div>
                                         <h3 className="text-sm font-black uppercase text-slate-700 tracking-widest">{proj.name} <span className="text-slate-400 ml-2">({members.length})</span></h3>
                                      </div>
                                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                         {members.map(member => renderMemberRow(member))}
                                      </div>
                                   </div>
                                );
                             })}
                          </div>
                       </div>
                    </div>
                 )}

              </div>
            )}

            {view === 'projects' && (
              <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50">
                <div className="max-w-6xl mx-auto pb-20 animate-in slide-in-from-bottom-4 duration-500">
                  <header className="flex items-center gap-4 mb-10">
                    <div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900">
                      <FolderKanban className="text-white w-8 h-8" />
                    </div>
                    <div>
                      <h2 className="text-4xl font-black text-slate-800 tracking-tighter">Project Management</h2>
                      <p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1">Active Initiatives & Workstreams</p>
                    </div>
                  </header>

                  <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 mb-10">
                    <h4 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><Sparkles className="text-indigo-500" size={18}/> Start a New Project</h4>
                    <div className="flex flex-col lg:flex-row gap-4">
                      <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Project Name" className="flex-1 px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700" />
                      <input type="text" value={newProjectDesc} onChange={e => setNewProjectDesc(e.target.value)} placeholder="Short Description" className="flex-[2] px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700" />
                      <button onClick={handleCreateProject} disabled={!newProjectName.trim()} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-indigo-500 transition-colors whitespace-nowrap">Deploy</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {projects.map(proj => (
                      <div key={proj.id} className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 group">
                        <div className="flex justify-between items-start mb-4">
                          <div className="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest border border-indigo-100">{proj.status || 'Active'}</div>
                        </div>
                        <h4 className="text-2xl font-black text-slate-800 mb-3 truncate group-hover:text-indigo-600 transition-colors">{proj.name}</h4>
                        <p className="text-sm font-bold text-slate-500 line-clamp-2 mb-8 h-10">{proj.description}</p>
                        
                        <div className="pt-5 border-t border-slate-100 flex items-center justify-between">
                          <div className="flex -space-x-3">
                            {directory.filter(k => k.activeProject === proj.id).slice(0, 4).map((member, i) => (
                              <div key={i} className="w-10 h-10 rounded-full border-2 border-white bg-slate-100 flex items-center justify-center overflow-hidden z-10 shadow-sm">
                                <ChibiAvatar config={member.avatarConfig} size={40} effectiveStatus={getEffectiveStatus(member)} className="translate-y-2" />
                              </div>
                            ))}
                            {directory.filter(k => k.activeProject === proj.id).length > 4 && (
                               <div className="w-10 h-10 rounded-full border-2 border-white bg-slate-200 flex items-center justify-center z-10 shadow-sm">
                                 <span className="text-[10px] font-black text-slate-600">+{directory.filter(k => k.activeProject === proj.id).length - 4}</span>
                               </div>
                            )}
                            {directory.filter(k => k.activeProject === proj.id).length === 0 && (
                              <span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-3 py-2 rounded-xl">No active members</span>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                    {projects.length === 0 && (
                       <div className="col-span-full py-12 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-[3rem]">
                         <FolderKanban size={48} className="mb-4 text-slate-300" />
                         <p className="font-black tracking-widest uppercase">No active projects</p>
                       </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {view === 'history' && (() => {
              // Group historical logs for the current user by Date
              const groupedLogs = timeLogs
                .filter(log => log.userId === user.uid)
                .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))
                .reduce((acc, log) => {
                   if (!log.timestamp) return acc;
                   const d = new Date(log.timestamp.seconds * 1000).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                   if (!acc[d]) acc[d] = [];
                   acc[d].push(log);
                   return acc;
                }, {});

              return (
                <div className="w-full h-full p-4 md:p-8 overflow-y-auto bg-slate-50">
                  <div className="max-w-4xl mx-auto pb-20 animate-in slide-in-from-bottom-4 duration-500">
                    <header className="flex items-center gap-4 mb-10">
                      <div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900">
                        <HistoryIcon className="text-white w-8 h-8" />
                      </div>
                      <div>
                        <h2 className="text-4xl font-black text-slate-800 tracking-tighter">My History</h2>
                        <p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1">Attendance & Activity Logs</p>
                      </div>
                    </header>

                    {Object.keys(groupedLogs).length === 0 ? (
                      <div className="w-full py-20 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-[3rem]">
                         <Clock size={48} className="mb-4 text-slate-300" />
                         <p className="font-black tracking-widest uppercase">No activity logged yet</p>
                      </div>
                    ) : (
                      <div className="space-y-8">
                        {Object.entries(groupedLogs).map(([dateLabel, logs]) => (
                          <div key={dateLabel} className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                            <h4 className="text-sm font-black text-indigo-600 uppercase tracking-widest mb-6 border-b border-slate-100 pb-3">{dateLabel}</h4>
                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
                              {logs.map((log, idx) => {
                                const timeStr = new Date(log.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                let IconComp, iconColor, bg, actionText;
                                
                                switch(log.action) {
                                  case 'TIME_IN':
                                    IconComp = Play; iconColor = "text-emerald-500"; bg = "bg-emerald-50 border-emerald-200"; actionText = "Timed In"; break;
                                  case 'TIME_OUT':
                                    IconComp = LogOut; iconColor = "text-rose-500"; bg = "bg-rose-50 border-rose-200"; actionText = "Timed Out"; break;
                                  case 'BREAK_START':
                                    IconComp = Pause; iconColor = "text-orange-500"; bg = "bg-orange-50 border-orange-200"; actionText = "Started Break"; break;
                                  case 'BREAK_END':
                                    IconComp = Play; iconColor = "text-blue-500"; bg = "bg-blue-50 border-blue-200"; actionText = "Ended Break"; break;
                                  default:
                                    IconComp = Clock; iconColor = "text-slate-500"; bg = "bg-slate-50 border-slate-200"; actionText = "Activity Logged";
                                }

                                return (
                                  <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                    <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white bg-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10 relative">
                                      <IconComp size={16} className={iconColor} />
                                    </div>
                                    <div className={`w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-2xl border shadow-sm ${bg}`}>
                                      <div className="flex items-center justify-between">
                                        <h5 className="font-black text-slate-800 text-sm">{actionText}</h5>
                                        <time className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{timeStr}</time>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })()}

            {view === 'profile' && (
              <div className="w-full h-full p-4 md:p-8 overflow-y-auto bg-slate-50">
                <div className="max-w-7xl mx-auto pb-20 animate-in slide-in-from-bottom-4 duration-500">
                  <header className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
                    <div className="flex items-center gap-4">
                      <div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900">
                        <UserCircle className="text-white w-8 h-8" />
                      </div>
                      <div>
                        <h2 className="text-4xl font-black text-slate-800 tracking-tighter">My Profile</h2>
                        <p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1">Status & Identity Settings</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <button onClick={handleUpdateProfile} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg hover:bg-indigo-500 transition-all flex items-center gap-3">
                        <Save size={16} /> Save Changes
                      </button>
                      <button onClick={() => signOut(auth)} className="bg-white border-2 border-rose-200 text-rose-600 px-6 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm hover:bg-rose-50 transition-all flex items-center gap-3">
                        <LogOut size={16} /> Log Out
                      </button>
                    </div>
                  </header>

                  {/* QUICK ATTENDANCE & STATUS CARD */}
                  <div className="bg-white p-8 md:p-10 rounded-[3.5rem] shadow-xl border border-slate-100 mb-8">
                    <h4 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-3"><Clock className="text-indigo-500" /> Attendance & Status</h4>
                    <div className="flex flex-col lg:flex-row items-stretch gap-6">
                      
                      {/* Time In / Out / Break Toggle */}
                      <div className="flex-[1.5] w-full bg-slate-50 p-6 rounded-[2rem] border border-slate-100 flex flex-col items-center justify-center gap-4">
                         <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Time Tracking</p>
                         
                         <div className="flex w-full gap-3">
                           {userProfile?.isTimedIn ? (
                              <>
                                {userProfile?.isOnBreak ? (
                                  <button onClick={() => handleBreakToggle(false)} className="flex-1 py-4 bg-blue-500 text-white font-black rounded-2xl shadow-md hover:bg-blue-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                     <Play size={16} /> Resume Work
                                  </button>
                                ) : (
                                  <button onClick={() => handleBreakToggle(true)} className="flex-1 py-4 bg-orange-500 text-white font-black rounded-2xl shadow-md hover:bg-orange-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                     <Pause size={16} /> Pause for Break
                                  </button>
                                )}
                                <button onClick={() => handleTimeToggle(false)} className="flex-1 py-4 bg-rose-500 text-white font-black rounded-2xl shadow-md hover:bg-rose-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                   <LogOut size={16} /> Time Out
                                </button>
                              </>
                           ) : (
                              <button onClick={() => handleTimeToggle(true)} className="w-full py-4 bg-emerald-500 text-white font-black rounded-2xl shadow-md hover:bg-emerald-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                 <Play size={16} /> Time In
                              </button>
                           )}
                         </div>

                         <p className="text-[10px] font-bold text-slate-500">
                            {userProfile?.isTimedIn ? `Timed in at ${formatTime(userProfile?.lastTimeIn)}` : `Last out at ${formatTime(userProfile?.lastTimeOut)}`}
                         </p>
                      </div>
                      
                      {/* Status Dropdowns (Auto-saving) */}
                      <div className="flex-[2] w-full bg-slate-50 p-6 rounded-[2rem] border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                         <div className="space-y-2">
                           <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Working From</label>
                           <select 
                             value={profileForm.workStatus || 'office'} 
                             onChange={e => { setProfileForm({...profileForm, workStatus: e.target.value}); handleQuickStatusUpdate('workStatus', e.target.value); }} 
                             className="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700 appearance-none cursor-pointer shadow-sm"
                           >
                             {WORK_STATUSES.filter(s => s.selectable).map(s => (<option key={s.id} value={s.id}>{s.label}</option>))}
                           </select>
                         </div>
                         <div className="space-y-2">
                           <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Active Project</label>
                           <select 
                             value={profileForm.activeProject || ''} 
                             onChange={e => { setProfileForm({...profileForm, activeProject: e.target.value}); handleQuickStatusUpdate('activeProject', e.target.value); }} 
                             className="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700 appearance-none cursor-pointer shadow-sm"
                           >
                             <option value="">None / Open Work</option>
                             {projects.map(p => (<option key={p.id} value={p.id}>{p.name}</option>))}
                           </select>
                         </div>
                      </div>

                    </div>
                  </div>

                  <div className="flex flex-col xl:flex-row gap-8 items-stretch">
                    
                    {/* STUDIO SIDEBAR (Sticky Preview) */}
                    <div className="xl:w-[450px] shrink-0 order-2 lg:order-1">
                      <div className="bg-slate-900 rounded-[3.5rem] flex flex-col items-center justify-center p-12 relative overflow-hidden shadow-2xl border-b-8 border-indigo-900 sticky top-4 min-h-[650px]">
                        <div className="absolute inset-0 pointer-events-none opacity-20">
                           <Sparkles className="absolute top-10 left-10 text-white animate-pulse" size={24} />
                           <Sparkles className="absolute bottom-10 right-10 text-white animate-pulse delay-700" size={16} />
                        </div>
                        <div className="bg-white/10 backdrop-blur-md px-6 py-2 rounded-full mb-6 border border-white/10 flex items-center gap-2">
                          <Wand2 size={12} className="text-indigo-400" />
                          <p className="text-[10px] font-black text-white uppercase tracking-widest">Live Evolution</p>
                        </div>
                        
                        {/* Live Preview Avatar */}
                        <div className="relative w-full aspect-square flex items-center justify-center mb-6">
                          <div className="absolute inset-0 bg-indigo-500/20 blur-[100px] rounded-full animate-pulse"></div>
                          <ChibiAvatar config={profileForm.avatarConfig} size={320} effectiveStatus={getEffectiveStatus(userProfile)} className="relative z-10 drop-shadow-[0_45px_70px_rgba(0,0,0,0.9)]" />
                        </div>

                        <div className="text-center text-white space-y-2 z-10 w-full px-4">
                           <input 
                             type="text" 
                             value={profileForm.displayName || ''} 
                             onChange={e => setProfileForm({...profileForm, displayName: e.target.value})} 
                             className="bg-transparent text-3xl font-black tracking-tight text-center w-full outline-none border-b-2 border-white/10 focus:border-indigo-400 transition-colors pb-1"
                             placeholder="Your Nickname"
                           />
                           <select 
                             value={profileForm.dept || 'dev'} 
                             onChange={e => setProfileForm({...profileForm, dept: e.target.value})} 
                             className="bg-transparent text-indigo-400 font-bold uppercase text-xs tracking-[0.2em] text-center w-full outline-none cursor-pointer"
                           >
                             {FULL_ROOMS.map(room => (<option key={room.id} value={room.id} className="bg-slate-800">{room.name}</option>))}
                           </select>
                        </div>
                      </div>
                    </div>

                    {/* CUSTOMIZATION CONTROLS */}
                    <div className="flex-1 space-y-8 order-1 lg:order-2">
                      
                      {/* Detailed AVATAR CREATION KIT (Mimicking Image) */}
                      <div className="bg-slate-50 p-8 rounded-[3.5rem] shadow-xl border border-slate-200" style={{ backgroundImage: 'linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px)', backgroundSize: '30px 30px' }}>
                        <div className="bg-white/80 backdrop-blur-md p-6 rounded-[2.5rem] shadow-sm mb-8 border border-white">
                          <h4 className="text-xl font-black text-slate-800 tracking-widest text-center uppercase">Avatar Creation Kit</h4>
                          <p className="text-slate-500 text-xs font-bold text-center uppercase tracking-widest">Modular SVG Assets</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                          {/* Left Column */}
                          <div className="space-y-8">
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <CategoryBlock title="1. Base Anatomy" featKey="bodyType" />
                               <div className="mt-4"><CategoryBlock title="Face Shape" featKey="head" /></div>
                            </div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <CategoryBlock title="2. Hairstyles" featKey="hair" />
                            </div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <CategoryBlock title="3. Facial Features" featKey="eyes" />
                               <div className="mt-4"><CategoryBlock title="Eyebrows" featKey="eyebrows" /></div>
                               <div className="mt-4"><CategoryBlock title="Mouths" featKey="mouth" /></div>
                            </div>
                          </div>

                          {/* Right Column */}
                          <div className="space-y-8">
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <CategoryBlock title="4. Clothing" featKey="top" />
                               <div className="mt-4"><CategoryBlock title="Bottoms" featKey="bottom" /></div>
                               <div className="mt-4"><CategoryBlock title="Shoes" featKey="shoes" /></div>
                            </div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <CategoryBlock title="5. Accessories" featKey="accessory" />
                            </div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-slate-200 pb-2 mb-4">6. Custom Colors</p>
                               <div className="grid grid-cols-5 gap-2">
                                 {[
                                   {k: 'skin', title: 'Skin'},
                                   {k: 'hairColor', title: 'Hair'},
                                   {k: 'topColor', title: 'Top'},
                                   {k: 'bottomColor', title: 'Pants'},
                                   {k: 'shoeColor', title: 'Shoes'}
                                 ].map(color => (
                                   <div key={color.k} className="flex flex-col items-center gap-1">
                                     <div className="relative w-10 h-10 rounded-xl border-2 border-slate-200 overflow-hidden cursor-pointer shadow-sm hover:scale-110 transition-transform">
                                       <input type="color" value={profileForm.avatarConfig[color.k]} onChange={e => updateAvatar(color.k, e.target.value)} className="absolute inset-[-10px] w-[calc(100%+20px)] h-[calc(100%+20px)] cursor-pointer" />
                                     </div>
                                     <span className="text-[8px] font-black uppercase text-slate-400">{color.title}</span>
                                   </div>
                                 ))}
                               </div>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Professional Details */}
                      <div className="bg-white p-8 rounded-[3rem] shadow-xl border border-slate-100 flex items-center justify-between gap-6 flex-wrap">
                        <div className="flex items-center gap-4">
                          <div className="bg-indigo-100 p-4 rounded-2xl"><Mail className="text-indigo-600" /></div>
                          <div>
                             <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Work Contact</p>
                             <p className="font-bold text-slate-800">{profileForm.email || 'Not provided'}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-4 md:border-l border-slate-100 md:pl-6">
                          <div className="bg-indigo-100 p-4 rounded-2xl"><Phone className="text-indigo-600" /></div>
                          <div>
                             <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Phone</p>
                             <p className="font-bold text-slate-800">{profileForm.contact || 'Not provided'}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {view === 'home' && <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50"><div className="max-w-3xl mx-auto space-y-8 pb-20"><header className="flex items-center gap-4 mb-10"><div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900"><MessageSquare className="text-white w-8 h-8" /></div><div><h2 className="text-4xl font-black text-slate-800 tracking-tighter text-center">Office Feed</h2></div></header><div className="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200"><textarea className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl h-[100px] outline-none" placeholder="Broadcast a thought..." value={newPost} onChange={(e) => setNewPost(e.target.value)} /><div className="mt-4 flex justify-end"><button onClick={handleCreatePost} disabled={!newPost.trim()} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-black text-xs uppercase shadow-lg disabled:opacity-50 hover:bg-slate-800 transition-colors">Post</button></div></div><div className="space-y-6">{posts.map(p => (<div key={p.id} className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100"><div className="flex items-center gap-4 mb-4"><div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200 shrink-0"><ChibiAvatar config={directory.find(k => k.uid === p.authorId)?.avatarConfig} size={48} effectiveStatus={getEffectiveStatus(directory.find(k => k.uid === p.authorId))} /></div><div><h4 className="font-black text-slate-800 tracking-tight">{(p.authorName || 'Colleague').toString()}</h4></div></div><p className="text-slate-600 font-medium text-lg leading-relaxed">{(p.content || '').toString()}</p></div>))}</div></div></div>}
            
            {view === 'directory' && <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50"><div className="max-w-6xl mx-auto pb-20"><h2 className="text-4xl font-black text-slate-800 tracking-tighter mb-10 text-center md:text-left">Network Directory</h2><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">{directory.map(kin => (<div key={kin.id} className="bg-white p-6 rounded-[2rem] border border-slate-100 hover:shadow-lg transition-shadow group"><div className="w-20 h-20 rounded-2xl border-4 border-slate-50 bg-slate-100 flex items-center justify-center overflow-hidden mb-4 group-hover:scale-105 transition-transform"><ChibiAvatar config={kin.avatarConfig} size={64} effectiveStatus={getEffectiveStatus(kin)} /></div><h4 className="text-xl font-black truncate">{(kin.displayName || 'Member').toString()}</h4><p className="text-slate-400 font-bold text-[10px] uppercase tracking-tighter truncate">{(kin.email || 'Private Email').toString()}</p><span className="inline-block px-3 py-1 bg-slate-100 text-slate-600 text-[10px] font-black uppercase rounded-lg mt-4">{DEPT_NAMES_LOOKUP[kin.dept] || 'Explorer'}</span></div>))}</div></div></div>}
          </main>
        </div>
      );
    }

    // Mount the React Application
    const root = ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<App />);
  </script>
</body>
</html>
