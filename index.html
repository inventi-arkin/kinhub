                    {Object.keys(groupedLogs).length === 0 ? (
                      <div className="w-full py-20 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-[3rem]"><Clock size={48} className="mb-4 text-slate-300" /><p className="font-black tracking-widest uppercase">No activity logged yet</p></div>
                    ) : (
                      <div className="space-y-8">
                        {Object.entries(groupedLogs).map(([dateLabel, logs]) => (
                          <div key={dateLabel} className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                            <h4 className="text-sm font-black text-indigo-600 uppercase tracking-widest mb-6 border-b border-slate-100 pb-3">{dateLabel}</h4>
                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
                              {logs.map((log, idx) => {
                                const timeStr = new Date(log.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                let IconComp, iconColor, bg, actionText;
                                switch(log.action) {
                                  case 'TIME_IN': IconComp = Play; iconColor = "text-emerald-500"; bg = "bg-emerald-50 border-emerald-200"; actionText = "Timed In"; break;
                                  case 'TIME_OUT': IconComp = LogOut; iconColor = "text-rose-500"; bg = "bg-rose-50 border-rose-200"; actionText = "Timed Out"; break;
                                  case 'BREAK_START': IconComp = Pause; iconColor = "text-orange-500"; bg = "bg-orange-50 border-orange-200"; actionText = "Started Break"; break;
                                  case 'BREAK_END': IconComp = Play; iconColor = "text-blue-500"; bg = "bg-blue-50 border-blue-200"; actionText = "Ended Break"; break;
                                  case 'STATUS_UPDATE': IconComp = Briefcase; iconColor = "text-indigo-500"; bg = "bg-indigo-50 border-indigo-200"; actionText = `Status: ${log.details || 'Updated'}`; break;
                                  case 'PROJECT_UPDATE': IconComp = FolderKanban; iconColor = "text-indigo-500"; bg = "bg-indigo-50 border-indigo-200"; actionText = `Project: ${log.details || 'Updated'}`; break;
                                  default: IconComp = Clock; iconColor = "text-slate-500"; bg = "bg-slate-50 border-slate-200"; actionText = "Activity Logged";
                                }
                                return (
                                  <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                    <div className="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white bg-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10 relative"><IconComp size={16} className={iconColor} /></div>
                                    <div className={`w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-2xl border shadow-sm ${bg}`}><div className="flex items-center justify-between"><h5 className="font-black text-slate-800 text-sm">{actionText}</h5><time className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{timeStr}</time></div></div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })()}

            {view === 'profile' && (
              <div className="w-full h-full p-4 md:p-8 overflow-y-auto bg-slate-50">

                      </div>

                        <h2 className="text-4xl font-black text-slate-800 tracking-tighter">{isOnboarding ? "Welcome! Set Up Profile" : "My Profile"}</h2>

                       <button onClick={handleUpdateProfile} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg hover:bg-indigo-500 transition-all flex items-center gap-3">
                         <Save size={16} /> {isOnboarding ? 'Join the Office' : 'Save Changes'}
                       </button>
                       {!isOnboarding && <button onClick={() => signOut(auth)} className="bg-white border-2 border-rose-200 text-rose-600 px-6 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm hover:bg-rose-50 transition-all flex items-center gap-3"><LogOut size={16} /> Log Out</button>}
                    </div>
                  </header>

                  {/* QUICK ATTENDANCE & STATUS CARD */}
                  {!isOnboarding && (
                    <div className="bg-white p-8 md:p-10 rounded-[3.5rem] shadow-xl border border-slate-100 mb-8">
                      <h4 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-3"><Clock className="text-indigo-500" /> Attendance & Status</h4>
                      <div className="flex flex-col lg:flex-row items-stretch gap-6">
                        
                        {/* Time In / Out Toggle */}
                        <div className="flex-1 w-full bg-slate-50 p-6 rounded-[2rem] border border-slate-100 flex flex-col items-center justify-center gap-4">
                           <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Time Tracking</p>
                           {userProfile?.isTimedIn ? (
                              <button onClick={() => handleTimeToggle(false)} className="w-full py-4 bg-rose-500 text-white font-black rounded-2xl shadow-md hover:bg-rose-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                 <Clock size={16} /> Time Out
                              </button>
                           ) : (
                              <button onClick={() => handleTimeToggle(true)} className="w-full py-4 bg-emerald-500 text-white font-black rounded-2xl shadow-md hover:bg-emerald-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-xs">
                                 <Clock size={16} /> Time In
                              </button>
                           )}
                           <p className="text-[10px] font-bold text-slate-500">
                              {userProfile?.isTimedIn ? `Timed in at ${formatTime(userProfile?.lastTimeIn)}` : `Last out at ${formatTime(userProfile?.lastTimeOut)}`}
                           </p>
                        </div>
                        
                        {/* Status Dropdowns (Auto-saving) */}
                        <div className="flex-[2] w-full bg-slate-50 p-6 rounded-[2rem] border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                           <div className="space-y-2">
                             <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Working From</label>
                             <select 
                               value={profileForm.workStatus || 'office'} 
                               onChange={e => { setProfileForm({...profileForm, workStatus: e.target.value}); handleQuickStatusUpdate('workStatus', e.target.value); }} 
                               className="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700 appearance-none cursor-pointer shadow-sm"
                             >
                               {WORK_STATUSES.map(s => (<option key={s.id} value={s.id}>{s.label}</option>))}
                             </select>
                           </div>
                           <div className="space-y-2">
                             <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-1">Active Project</label>
                             <select 
                               value={profileForm.activeProject || ''} 
                               onChange={e => { setProfileForm({...profileForm, activeProject: e.target.value}); handleQuickStatusUpdate('activeProject', e.target.value); }} 
                               className="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700 appearance-none cursor-pointer shadow-sm"
                             >
                               <option value="">None / Open Work</option>
                               {projects.map(p => (<option key={p.id} value={p.id}>{p.name}</option>))}
                             </select>
                           </div>
                        </div>

                      </div>
                    </div>
                  )}

                  <div className="flex flex-col xl:flex-row gap-8 items-stretch">
                    <div className="xl:w-[450px] shrink-0 order-2 lg:order-1">
                      <div className="bg-slate-900 rounded-[3.5rem] flex flex-col items-center justify-center p-12 relative overflow-hidden shadow-2xl border-b-8 border-indigo-900 sticky top-4 min-h-[650px]">
                        <div className="absolute inset-0 pointer-events-none opacity-20"><Sparkles className="absolute top-10 left-10 text-white animate-pulse" size={24} /><Sparkles className="absolute bottom-10 right-10 text-white animate-pulse delay-700" size={16} /></div>
                        <div className="bg-white/10 backdrop-blur-md px-6 py-2 rounded-full mb-6 border border-white/10 flex items-center gap-2"><Wand2 size={12} className="text-indigo-400" /><p className="text-[10px] font-black text-white uppercase tracking-widest">Live Evolution</p></div>
                        <div className="relative w-full aspect-square flex items-center justify-center mb-6">

                        </div>
                        <div className="text-center text-white space-y-2 z-10 w-full px-4">
                           <input type="text" value={profileForm.displayName || ''} onChange={e => { setProfileForm({...profileForm, displayName: e.target.value}); setUnsaved(true); }} className="bg-transparent text-3xl font-black tracking-tight text-center w-full outline-none border-b-2 border-white/10 focus:border-indigo-400 transition-colors pb-1" placeholder="Your Nickname" />
                           <select value={profileForm.dept || 'dev'} onChange={e => { setProfileForm({...profileForm, dept: e.target.value}); setUnsaved(true); }} className="bg-transparent text-indigo-400 font-bold uppercase text-xs tracking-[0.2em] text-center w-full outline-none cursor-pointer">
                             {FULL_ROOMS.map(room => (<option key={room.id} value={room.id} className="bg-slate-800">{room.name}</option>))}
                           </select>
                           <select value={profileForm.roleLevel || 'mid'} onChange={e => { setProfileForm({...profileForm, roleLevel: e.target.value}); setUnsaved(true); }} className="bg-transparent text-slate-400 font-bold uppercase text-[10px] tracking-[0.2em] text-center w-full outline-none cursor-pointer mt-1">
                             {ROLE_LEVELS.map(role => (<option key={role.id} value={role.id} className="bg-slate-800">{role.label}</option>))}
                           </select>
                        </div>
                      </div>
                    </div>

                    <div className="flex-1 space-y-8 order-1 lg:order-2">
                      <div className="bg-slate-50 p-8 rounded-[3.5rem] shadow-xl border border-slate-200" style={{ backgroundImage: 'linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px)', backgroundSize: '30px 30px' }}>
                        <div className="bg-white/80 backdrop-blur-md p-6 rounded-[2.5rem] shadow-sm mb-8 border border-white"><h4 className="text-xl font-black text-slate-800 tracking-widest text-center uppercase">Avatar Creation Kit</h4><p className="text-slate-500 text-xs font-bold text-center uppercase tracking-widest">Modular SVG Assets</p></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                          <div className="space-y-8">
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm"><CategoryBlock title="1. Base Anatomy" featKey="bodyType" /><div className="mt-4"><CategoryBlock title="Face Shape" featKey="head" /></div></div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm"><CategoryBlock title="2. Hairstyles" featKey="hair" /></div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm"><CategoryBlock title="3. Facial Features" featKey="eyes" /><div className="mt-4"><CategoryBlock title="Eyebrows" featKey="eyebrows" /></div><div className="mt-4"><CategoryBlock title="Mouths" featKey="mouth" /></div><div className="mt-4"><CategoryBlock title="Details" featKey="details" /></div></div>
                          </div>
                          <div className="space-y-8">
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm"><CategoryBlock title="4. Clothing" featKey="top" /><div className="mt-4"><CategoryBlock title="Bottoms" featKey="bottom" /></div><div className="mt-4"><CategoryBlock title="Shoes" featKey="shoes" /></div></div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm"><CategoryBlock title="5. Accessories" featKey="accessory" /></div>
                            <div className="bg-white/90 backdrop-blur p-6 rounded-3xl border border-slate-200 shadow-sm">
                               <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-slate-200 pb-2 mb-4">6. Custom Colors</p>
                               <div className="grid grid-cols-5 gap-2">
                                 {[{k: 'skin', title: 'Skin'}, {k: 'hairColor', title: 'Hair'}, {k: 'topColor', title: 'Top'}, {k: 'bottomColor', title: 'Pants'}, {k: 'shoeColor', title: 'Shoes'}].map(color => (
                                   <div key={color.k} className="flex flex-col items-center gap-1"><div className="relative w-10 h-10 rounded-xl border-2 border-slate-200 overflow-hidden cursor-pointer shadow-sm hover:scale-110 transition-transform"><input type="color" value={profileForm.avatarConfig[color.k]} onChange={e => updateAvatar(color.k, e.target.value)} className="absolute inset-[-10px] w-[calc(100%+20px)] h-[calc(100%+20px)] cursor-pointer" /></div><span className="text-[8px] font-black uppercase text-slate-400">{color.title}</span></div>
                                 ))}
                               </div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white p-8 rounded-[3rem] shadow-xl border border-slate-100 flex items-center justify-between gap-6 flex-wrap">
                        <div className="flex items-center gap-4">
                          <div className="bg-indigo-100 p-4 rounded-2xl"><Mail className="text-indigo-600" /></div>
                          <div><p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Work Contact</p><p className="font-bold text-slate-800">{profileForm.email || 'Not provided'}</p></div>
                        </div>
                        <div className="flex items-center gap-4 md:border-l border-slate-100 md:pl-6">
                          <div className="bg-indigo-100 p-4 rounded-2xl"><Phone className="text-indigo-600" /></div>
                          <div className="w-full max-w-[200px]"><p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Phone</p><input type="text" value={profileForm.contact || ''} onChange={e => { setProfileForm({...profileForm, contact: e.target.value}); setUnsaved(true); }} placeholder="Enter phone" className="bg-transparent text-sm font-bold text-slate-700 outline-none w-full border-b border-dashed border-slate-300 focus:border-indigo-400 transition-colors" /></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {view === 'home' && <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50"><div className="max-w-3xl mx-auto space-y-8 pb-20"><header className="flex items-center gap-4 mb-10"><div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900"><MessageSquare className="text-white w-8 h-8" /></div><div><h2 className="text-4xl font-black text-slate-800 tracking-tighter text-center">Office Feed</h2></div></header><div className="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200"><textarea className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl h-[100px] outline-none" placeholder="Broadcast a thought..." value={newPost} onChange={(e) => setNewPost(e.target.value)} /><div className="mt-4 flex justify-end"><button onClick={handleCreatePost} disabled={!newPost.trim()} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-black text-xs uppercase shadow-lg disabled:opacity-50 hover:bg-slate-800 transition-colors">Post</button></div></div><div className="space-y-6">{posts.map(p => (<div key={p.id} className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100"><div className="flex items-center gap-4 mb-4"><div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200 shrink-0"><ChibiAvatar config={directory.find(k => k.uid === p.authorId)?.avatarConfig} size={48} effectiveStatus={getEffectiveStatus(directory.find(k => k.uid === p.authorId))} /></div><div><h4 className="font-black text-slate-800 tracking-tight">{(p.authorName || 'Colleague').toString()}</h4></div></div><p className="text-slate-600 font-medium text-lg leading-relaxed">{(p.content || '').toString()}</p></div>))}</div></div></div>}
            
            {view === 'directory' && (() => {
              const execDepts = ['ceo_cube', 'cto_cube', 'cfo_cube'];
              const excludedDepts = ['wash', 'events', 'pantry', 'clinic', 'hall', 'reception', 'exec_hall'];
              const roleRanks = { exec: 1, head: 2, oic: 3, manager: 4, supervisor: 5, senior: 6, mid: 7, junior: 8, associate: 9, intern: 10 };
              
              const getRoleLabel = (roleId) => ROLE_LEVELS.find(r => r.id === roleId)?.label || 'Member';

              const executives = directory.filter(u => execDepts.includes(u.dept) || u.roleLevel === 'exec').sort((a,b) => (roleRanks[a.roleLevel || 'mid'] || 99) - (roleRanks[b.roleLevel || 'mid'] || 99));
              const validDepts = FULL_ROOMS.filter(r => !execDepts.includes(r.id) && !excludedDepts.includes(r.id));

              const OrgCard = ({ user, compact }) => (
                <div className={`bg-white border border-slate-200 rounded-2xl p-3 flex ${compact ? 'flex-row items-center text-left w-full' : 'flex-col items-center text-center w-48'} gap-3 shadow-sm hover:shadow-md transition-all relative overflow-hidden group`}>
                  <div className={`rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center overflow-hidden shrink-0 ${compact ? 'w-10 h-10' : 'w-20 h-20'}`}>
                    <ChibiAvatar config={user.avatarConfig} size={compact ? 40 : 80} effectiveStatus={getEffectiveStatus(user)} className={compact ? 'translate-y-1.5' : 'translate-y-4'} />
                  </div>
                  <div className="min-w-0 flex-1 w-full">
                    <h4 className={`font-black text-slate-800 truncate ${compact ? 'text-xs' : 'text-sm'}`}>{user.displayName || 'Member'}</h4>
                    <p className="text-indigo-600 font-bold uppercase text-[9px] tracking-widest truncate">{getRoleLabel(user.roleLevel)}</p>
                    {!compact && <p className="text-slate-400 font-bold text-[9px] uppercase tracking-tighter mt-1 truncate">{user.email}</p>}
                  </div>
                </div>
              );

              return (
                <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50">
                  <div className="max-w-7xl mx-auto pb-32">
                    <header className="flex items-center gap-4 mb-16 justify-center md:justify-start">
                      <div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900 text-white"><Users size={28} /></div>
                      <div>
                        <h2 className="text-4xl font-black text-slate-800 tracking-tighter">Organization Chart</h2>
                        <p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1">Company Structure & Directory</p>
                      </div>
                    </header>

                    <div className="flex flex-col items-center w-full relative z-10">
                       <div className="flex flex-wrap justify-center gap-6 mb-8 relative">
                          {executives.map(exec => <OrgCard key={exec.uid} user={exec} />)}
                       </div>
                       
                       {validDepts.length > 0 && executives.length > 0 && (
                          <div className="flex flex-col items-center w-full mb-8">
                             <div className="w-0.5 h-8 bg-slate-300"></div>
                             <div className="w-full max-w-4xl h-0.5 bg-slate-300"></div>
                             <div className="w-full max-w-4xl flex justify-between px-12"><div className="w-0.5 h-8 bg-slate-300"></div><div className="w-0.5 h-8 bg-slate-300"></div><div className="w-0.5 h-8 bg-slate-300"></div></div>
                          </div>
                       )}

                       <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full items-start">
                          {validDepts.map(dept => {
                             const members = directory.filter(u => u.dept === dept.id && !executives.some(e => e.uid === u.uid)).sort((a,b) => (roleRanks[a.roleLevel || 'mid'] || 99) - (roleRanks[b.roleLevel || 'mid'] || 99));
                             if (members.length === 0) return null;
                             return (
                               <div key={dept.id} className="flex flex-col items-center bg-white/60 backdrop-blur-sm rounded-3xl p-5 shadow-sm border border-slate-200">
                                 <h3 className="font-black text-slate-800 text-xs uppercase tracking-widest mb-5 border-b-2 border-indigo-100 pb-2 w-full text-center">{dept.name}</h3>
                                 <div className="flex flex-col gap-3 w-full">
                                    {members.map(member => <OrgCard key={member.uid} user={member} compact />)}
                                 </div>
                               </div>
                             )
                          })}
                       </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Save Profile Confirmation Modal */}
            {showSaveConfirm && (
              <div className="absolute inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={() => setShowSaveConfirm(false)}>
                <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-sm w-full animate-in zoom-in-95 text-center" onClick={e => e.stopPropagation()}>
                  <div className="mx-auto w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-inner"><Save size={24} className="text-indigo-500" /></div>
                  <h3 className="text-2xl font-black text-slate-800 mb-2">{isOnboarding ? "Ready to Join?" : "Save Profile?"}</h3><p className="text-xs font-bold text-slate-500 mb-8 uppercase tracking-widest">{isOnboarding ? "You will enter the office as this avatar." : "Update your avatar and details."}</p>
                  <div className="flex gap-4"><button onClick={() => setShowSaveConfirm(false)} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-colors">Cancel</button><button onClick={executeSaveProfile} className="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-indigo-500 transition-colors">Confirm</button></div>
                </div>
              </div>
            )}

            {/* Time Action Confirmation Modal */}
            {pendingTimeAction && (
              <div className="absolute inset-0 z-[110] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={() => setPendingTimeAction(null)}>
                <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-sm w-full animate-in zoom-in-95 text-center" onClick={e => e.stopPropagation()}>
                  <div className={`mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-inner ${pendingTimeAction === 'TIME_IN' ? 'bg-emerald-50 text-emerald-500' : pendingTimeAction === 'TIME_OUT' ? 'bg-rose-50 text-rose-500' : pendingTimeAction === 'BREAK_START' ? 'bg-orange-50 text-orange-500' : 'bg-blue-50 text-blue-500'}`}>
                    {pendingTimeAction === 'TIME_IN' && <Play size={24} />}{pendingTimeAction === 'TIME_OUT' && <LogOut size={24} />}{pendingTimeAction === 'BREAK_START' && <Pause size={24} />}{pendingTimeAction === 'BREAK_END' && <Play size={24} />}
                  </div>
                  <h3 className="text-2xl font-black text-slate-800 mb-2">Confirm Action</h3>
                  <p className="text-xs font-bold text-slate-500 mb-8 uppercase tracking-widest">
                    {pendingTimeAction === 'TIME_IN' && "Are you sure you want to Time In?"}{pendingTimeAction === 'TIME_OUT' && "Are you sure you want to Time Out?"}{pendingTimeAction === 'BREAK_START' && "Are you sure you want to take a break?"}{pendingTimeAction === 'BREAK_END' && "Ready to resume work?"}
                  </p>
                  <div className="flex gap-4">
                    <button onClick={() => setPendingTimeAction(null)} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-colors">Cancel</button>
                    <button onClick={executePendingTimeAction} className={`flex-1 py-4 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg transition-colors ${pendingTimeAction === 'TIME_IN' ? 'bg-emerald-500 hover:bg-emerald-400' : pendingTimeAction === 'TIME_OUT' ? 'bg-rose-500 hover:bg-rose-400' : pendingTimeAction === 'BREAK_START' ? 'bg-orange-500 hover:bg-orange-400' : 'bg-blue-500 hover:bg-blue-400'}`}>Confirm</button>
                  </div>
                </div>
              </div>
            )}

            {/* Unsaved Changes Warning Modal */}
            {pendingNavView && (
              <div className="absolute inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={() => setPendingNavView(null)}>
                <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-sm w-full animate-in zoom-in-95 text-center" onClick={e => e.stopPropagation()}>
                  <div className="mx-auto w-16 h-16 bg-amber-50 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-inner"><ShieldAlert size={24} className="text-amber-500" /></div>
                  <h3 className="text-2xl font-black text-slate-800 mb-2">Unsaved Changes</h3><p className="text-xs font-bold text-slate-500 mb-8 uppercase tracking-widest">Save your profile before leaving?</p>
                  <div className="flex flex-col gap-3">
                    <button onClick={async () => { await executeSaveProfile(); setView(pendingNavView); setPendingNavView(null); setSelectedUserId(null); setIsChatOpen(false); }} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-indigo-500 transition-colors">Save & Continue</button>
                    <button onClick={() => { setUnsaved(false); if (userProfile) { setProfileForm({ displayName: userProfile.displayName || '', email: userProfile.email || '', contact: userProfile.contact || '', dept: userProfile.dept || 'dev', roleLevel: userProfile.roleLevel || 'mid', workStatus: userProfile.workStatus || 'office', activeProject: userProfile.activeProject || '', isTimedIn: userProfile.isTimedIn || false, isOnBreak: userProfile.isOnBreak || false, avatarConfig: userProfile.avatarConfig || profileForm.avatarConfig }); } setView(pendingNavView); setPendingNavView(null); setSelectedUserId(null); setIsChatOpen(false); }} className="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-colors">Discard Changes</button>
                    <button onClick={() => setPendingNavView(null)} className="w-full py-4 bg-transparent text-slate-400 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:text-slate-600 transition-colors">Cancel</button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<App />);
  </script>
</body>
</html>
