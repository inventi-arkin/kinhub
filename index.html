    ];

    const DEPT_NAMES_LOOKUP = FULL_ROOMS.reduce((acc, r) => ({...acc, [r.id]: r.name}), {});

    // Calculate effective status taking Time In/Out and Breaks into account
    const getEffectiveStatus = (member) => {
      if (!member) return 'mia';
      if (!member.isTimedIn && member.workStatus !== 'leave' && member.workStatus !== 'sick') return 'mia';
      if (member.isTimedIn && member.isOnBreak) return 'break';
      return member.workStatus || 'office';
    };

    const WORK_STATUSES = [
      { id: 'office', label: 'In the Office', icon: Briefcase, selectable: true },
      { id: 'wfh', label: 'Working From Home', icon: Home, selectable: true },
      { id: 'cafe', label: 'Working From Cafe', icon: Coffee, selectable: true },
      { id: 'field', label: 'On Field Work', icon: MapPin, selectable: true },
      { id: 'leave', label: 'On Leave', icon: Plane, selectable: true },
      { id: 'sick', label: 'Is Sick', icon: Bed, selectable: true },
      { id: 'mia', label: 'Missing In Action', icon: UserX, selectable: false },
      { id: 'break', label: 'Having a Break', icon: Coffee, selectable: false }
    ];

    const AVATAR_OPTIONS = {
      bodyType: ['Standard', 'Slender', 'Sturdy'],
      head: ['Round', 'Square', 'Pointy', 'Oval'],
      hair: ['Short', 'Spiky', 'Long', 'Bald', 'Bob', 'Curly', 'Ponytail', 'Braids', 'Undercut', 'Messy', 'Afro', 'Buns', 'SlickedBack', 'HalfUp'],
      eyes: ['Basic', 'Ovals', 'Squint', 'Expressive'],
      eyebrows: ['Standard', 'Angry', 'Sad', 'None'],
      mouth: ['Smile', 'Open', 'Line', 'Frown', 'Smirk'],
      top: ['Tee', 'Hoodie', 'ButtonUp', 'Blazer', 'Flannel', 'TankTop'],
      bottom: ['Jeans', 'Slacks', 'Shorts', 'Skirt'],
      shoes: ['Sneakers', 'Boots'],
      accessory: ['None', 'Glasses', 'Headphones', 'Mask', 'Scarf']
    };

    const ChibiAvatar = ({ config, size = 64, className = "", effectiveStatus = 'office', style = {} }) => {
      const { 
        skin = '#ffcbab', 
        topColor = '#3b82f6', 
        hairColor = '#475569',
        bottomColor = '#1e293b',
        shoeColor = '#0f172a',
        bodyType = 'Standard',
        head = 'Round',
        hair = 'Short',
        eyes = 'Basic',
        eyebrows = 'Standard',
        mouth = 'Smile',
        top = 'Tee',
        bottom = 'Jeans',
        shoes = 'Sneakers',
        accessory = 'None'
      } = config || {};

      const hasSleeves = top !== 'TankTop';
      const isPlaid = top === 'Flannel';
      const isGhost = effectiveStatus === 'leave';
      const isMIA = effectiveStatus === 'mia';
      
      // Body scaling offsets for silhouette
      let tW = 36, tX = 32, aL = 20, aR = 68; 
      if (bodyType === 'Sturdy') { tW = 44; tX = 28; aL = 16; aR = 72; }
      if (bodyType === 'Slender') { tW = 28; tX = 36; aL = 24; aR = 64; }

      return (
        <svg width={size} height={size * 1.5} viewBox="0 0 100 150" className={`${isGhost ? 'ghost-avatar' : ''} ${isMIA ? 'glow-red' : ''} ${className}`} style={{ ...style, '--anim-delay': style.animationDelay || '0s' }} overflow="visible">
          <defs>
            <pattern id={`plaid-${topColor.replace('#','')}`} x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
              <rect width="12" height="12" fill={topColor} />
              <path d="M 0 6 H 12 M 6 0 V 12" stroke="rgba(0,0,0,0.15)" strokeWidth="3" />
              <path d="M 0 2 H 12 M 2 0 V 12" stroke="rgba(255,255,255,0.15)" strokeWidth="1" />
            </pattern>
          </defs>

          {/* GLOBAL GROUP FOR CHIBI LINE ART STYLE */}
          <g stroke="#1c1917" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            
            {/* BACK HAIR (Animated) */}
            <g id="back-hair" fill={hairColor} className="breathe-target">
              {hair === 'Long' && <path d="M 16 45 A 34 42 0 0 1 84 45 L 88 100 C 60 110 40 110 12 100 Z" />}
              {hair === 'Bob' && <path d="M 16 45 A 34 42 0 0 1 84 45 L 86 75 C 60 85 40 85 14 75 Z" />}
              {hair === 'Ponytail' && <circle cx="85" cy="35" r="16" />}
              {hair === 'HalfUp' && <path d="M 16 45 A 34 42 0 0 1 84 45 L 85 95 C 60 100 40 100 15 95 Z" />}
              {hair === 'Buns' && (
                 <g>
                   <circle cx="20" cy="20" r="14" />
                   <circle cx="80" cy="20" r="14" />
                 </g>
              )}
              {hair === 'Braids' && (
                 <g>
                   <path d="M 25 50 C 10 70 10 100 25 115" fill="none" stroke={hairColor} strokeWidth="12" />
                   <path d="M 75 50 C 90 70 90 100 75 115" fill="none" stroke={hairColor} strokeWidth="12" />
                 </g>
              )}
            </g>

            {/* LEGS & SHOES (Planted, Not Animated) */}
            <g id="legs-and-shoes">
              {/* Legs extended upward to 85 to prevent gap when torso breathes up */}
              <rect x={tX + 4} y="85" width="12" height="50" rx="3" fill={bottomColor} />
              <rect x={tX + tW - 16} y="85" width="12" height="50" rx="3" fill={bottomColor} />
              
              {/* Shoes */}
              <g fill={shoeColor}>
                {shoes === 'Sneakers' ? (
                  <g>
                    <path d={`M ${tX + 1} 130 h 16 v 6 a 4 4 0 0 1 -4 4 h -8 a 4 4 0 0 1 -4 -4 z`} />
                    <path d={`M ${tX + tW - 19} 130 h 16 v 6 a 4 4 0 0 1 -4 4 h -8 a 4 4 0 0 1 -4 -4 z`} />
                    {/* Sneaker Toe Caps */}
                    <path d={`M ${tX + 1} 135 h 16 v 2 a 3 3 0 0 1 -3 3 h -10 a 3 3 0 0 1 -3 -3 z`} fill="white" strokeWidth="1.5" />
                    <path d={`M ${tX + tW - 19} 135 h 16 v 2 a 3 3 0 0 1 -3 3 h -10 a 3 3 0 0 1 -3 -3 z`} fill="white" strokeWidth="1.5" />
                  </g>
                ) : (
                  <g>
                    <path d={`M ${tX + 2} 122 h 14 v 14 a 4 4 0 0 1 -4 4 h -8 a 2 2 0 0 1 -2 -2 z`} />
                    <path d={`M ${tX + tW - 18} 122 h 14 v 14 a 4 4 0 0 1 -4 4 h -8 a 2 2 0 0 1 -2 -2 z`} />
                  </g>
                )}
              </g>
            </g>

            {/* UPPER BODY GROUP (Animated for Breathing) */}
            <g className="breathe-target">
              
              {/* TORSO & TOPS */}
              <g id="torso">
                {bottom === 'Skirt' && (
                   <path d={`M ${tX} 95 L ${tX - 5} 120 L ${tX + tW + 5} 120 L ${tX + tW} 95 Z`} fill={bottomColor} />
                )}
                {bottom === 'Shorts' && (
                   <path d={`M ${tX} 95 L ${tX - 2} 115 L ${tX + tW + 2} 115 L ${tX + tW} 95 Z`} fill={bottomColor} />
                )}

                <rect x={tX} y="65" width={tW} height="40" rx="10" fill={isPlaid ? `url(#plaid-${topColor.replace('#','')})` : topColor} />
                
                {/* Top Details */}
                {top === 'Hoodie' && (
                   <g>
                     <path d={`M ${tX + 10} 65 Q ${tX + tW/2} 85 ${tX + tW - 10} 65`} fill="none" strokeWidth="2" opacity="0.3" />
                     <path d={`M ${tX + tW/2 - 5} 80 L ${tX + tW/2 - 5} 90 M ${tX + tW/2 + 5} 80 L ${tX + tW/2 + 5} 90`} stroke="#1c1917" strokeWidth="1.5" />
                     <path d={`M ${tX + 5} 95 Q ${tX + tW/2} 85 ${tX + tW - 5} 95`} fill="none" stroke="#1c1917" strokeWidth="1.5" opacity="0.5" />
                   </g>
                )}
                {top === 'ButtonUp' && (
                   <g fill="white" strokeWidth="1.5">
                     <path d={`M ${tX + tW/2} 65 L ${tX + tW/2 - 8} 75 L ${tX + tW/2} 80 Z`} />
                     <path d={`M ${tX + tW/2} 65 L ${tX + tW/2 + 8} 75 L ${tX + tW/2} 80 Z`} />
                     <line x1={tX + tW/2} y1="80" x2={tX + tW/2} y2="105" />
                   </g>
                )}
                {top === 'Blazer' && (
                   <g fill="white" strokeWidth="1.5">
                     <path d={`M ${tX + 5} 65 L ${tX + tW/2} 85 L ${tX + tW - 5} 65 Z`} />
                     <path d={`M ${tX + tW/2} 85 L ${tX + tW/2} 105`} />
                     <path d={`M ${tX} 65 L ${tX + tW/2} 85 L ${tX + 10} 105`} fill={topColor} opacity="0.8" />
                     <path d={`M ${tX + tW} 65 L ${tX + tW/2} 85 L ${tX + tW - 10} 105`} fill={topColor} opacity="0.8" />
                   </g>
                )}
              </g>

              {/* ARMS & SLEEVES */}
              <g id="arms">
                <rect x={aL} y="65" width="12" height="35" rx="6" fill={skin} />
                <rect x={aR} y="65" width="12" height="35" rx="6" fill={skin} />
                {hasSleeves && (
                   <g fill={isPlaid ? `url(#plaid-${topColor.replace('#','')})` : topColor}>
                     <rect x={aL} y="65" width="12" height="22" rx="4" />
                     <rect x={aR} y="65" width="12" height="22" rx="4" />
                   </g>
                )}
              </g>

              {/* NECK */}
              <rect x="42" y="55" width="16" height="15" fill={skin} />

              {/* HEAD */}
              <g id="head" fill={skin}>
                {head === 'Square' ? (
                  <path d="M 20 40 A 30 30 0 0 1 80 40 L 80 65 Q 80 75 65 75 H 35 Q 20 75 20 65 Z" />
                ) : head === 'Pointy' ? (
                  <path d="M 20 40 A 30 30 0 0 1 80 40 L 75 55 Q 50 85 25 55 Z" />
                ) : head === 'Oval' ? (
                  <path d="M 20 40 A 30 30 0 0 1 80 40 A 30 35 0 0 1 20 40 Z" />
                ) : ( // Round
                  <path d="M 20 40 A 30 30 0 0 1 80 40 A 30 30 0 0 1 20 40 Z" />
                )}
              </g>

              {/* FACE */}
              <g id="face">
                {/* Eyebrows */}
                <g fill="none" strokeWidth="2.5">
                  {eyebrows === 'Standard' && <path d="M 30 36 Q 36 33 42 36 M 58 36 Q 64 33 70 36" />}
                  {eyebrows === 'Angry' && <path d="M 30 34 L 42 38 M 70 34 L 58 38" strokeWidth="3" />}
                  {eyebrows === 'Sad' && <path d="M 30 38 L 42 34 M 70 38 L 58 34" />}
                </g>

                {/* Eyes */}
                <g id="eyes">
                  {eyes === 'Ovals' ? (
                    <g fill="#1c1917" stroke="none">
                      <ellipse cx="36" cy="44" rx="4" ry="7" />
                      <circle cx="37" cy="41" r="2" fill="white" />
                      <ellipse cx="64" cy="44" rx="4" ry="7" />
                      <circle cx="65" cy="41" r="2" fill="white" />
                    </g>
                  ) : eyes === 'Squint' ? (
                    <g fill="none" strokeWidth="2.5">
                      <path d="M 32 46 Q 36 40 40 46" />
                      <path d="M 60 46 Q 64 40 68 46" />
                    </g>
                  ) : eyes === 'Expressive' ? (
                    <g fill="none" strokeWidth="2.5">
                      <path d="M 32 44 Q 38 38 44 44" />
                      <circle cx="38" cy="46" r="3" fill="#1c1917" stroke="none" />
                      <path d="M 56 44 Q 62 38 68 44" />
                      <circle cx="62" cy="46" r="3" fill="#1c1917" stroke="none" />
                    </g>
                  ) : ( // Basic
                    <g fill="#1c1917" stroke="none">
                      <circle cx="36" cy="44" r="3.5" />
                      <circle cx="64" cy="44" r="3.5" />
                    </g>
                  )}
                </g>

                {/* Mouth */}
                <g id="mouth" fill="none" strokeWidth="2.5">
                  {mouth === 'Open' ? (
                     <path d="M 44 56 A 6 6 0 0 0 56 56 Z" fill="#991b1b" strokeWidth="1.5" />
                  ) : mouth === 'Line' ? (
                     <path d="M 45 56 H 55" strokeWidth="2" />
                  ) : mouth === 'Frown' ? (
                     <path d="M 45 58 Q 50 54 55 58" />
                  ) : mouth === 'Smirk' ? (
                     <path d="M 44 57 Q 52 60 56 53" />
                  ) : ( // Smile
                     <path d="M 44 54 Q 50 60 56 54" />
                  )}
                </g>
              </g>

              {/* FRONT HAIR */}
              {hair !== 'Bald' && (
                <g id="front-hair" fill={hairColor}>
                  {hair === 'Short' && <path d="M 16 45 A 34 42 0 0 1 84 45 C 75 25 55 20 50 30 C 45 20 25 25 16 45 Z" />}
                  {hair === 'Spiky' && <path d="M 16 45 L 20 5 L 35 15 L 50 -10 L 65 15 L 80 5 L 84 45 C 70 25 30 25 16 45 Z" />}
                  {hair === 'Undercut' && <path d="M 18 40 A 32 38 0 0 1 82 40 C 65 15 35 15 18 40 Z" />}
                  {hair === 'Curly' && (
                     <g strokeWidth="2.5">
                       <circle cx="35" cy="15" r="14"/><circle cx="50" cy="5" r="16"/><circle cx="65" cy="15" r="14"/>
                       <circle cx="20" cy="35" r="12"/><circle cx="80" cy="35" r="12"/>
                     </g>
                  )}
                  {hair === 'Bob' && <path d="M 16 45 A 34 42 0 0 1 84 45 C 80 25 20 25 16 45 Z" />}
                  {(hair === 'Long' || hair === 'Braids' || hair === 'Ponytail') && (
                     <path d="M 16 45 A 34 42 0 0 1 84 45 C 75 25 25 25 16 45 Z" />
                  )}
                  {hair === 'Messy' && <path d="M 16 45 A 34 42 0 0 1 84 45 L 75 20 L 60 30 L 45 15 L 30 35 L 20 20 Z" />}
                  {hair === 'SlickedBack' && <path d="M 16 45 A 34 42 0 0 1 84 45 C 70 30 30 30 16 45 Z" />}
                  {hair === 'Afro' && <path d="M 10 45 C -10 10 30 -20 50 -20 C 70 -20 110 10 90 45 C 75 30 25 30 10 45 Z" />}
                  {(hair === 'Buns' || hair === 'HalfUp') && (
                     <g>
                       <path d="M 16 45 A 34 42 0 0 1 84 45 C 75 25 25 25 16 45 Z" />
                       {hair === 'HalfUp' && <circle cx="50" cy="5" r="12" />}
                     </g>
                  )}
                </g>
              )}

              {/* ACCESSORIES */}
              <g id="accessories">
                {accessory === 'Mask' && (
                   <path d="M 25 54 Q 50 75 75 54 L 70 65 Q 50 75 30 65 Z" fill="white" />
                )}
                {accessory === 'Glasses' && (
                   <g fill="rgba(255,255,255,0.3)">
                     <rect x="28" y="38" width="18" height="14" rx="4" />
                     <rect x="54" y="38" width="18" height="14" rx="4" />
                     <path d="M 46 42 H 54" />
                   </g>
                )}
                {accessory === 'Headphones' && (
                   <g fill="#1e293b">
                     <path d="M 18 40 Q 18 5 50 5 Q 82 5 82 40" fill="none" stroke="#1e293b" strokeWidth="6" />
                     <rect x="13" y="30" width="10" height="25" rx="5" />
                     <rect x="77" y="30" width="10" height="25" rx="5" />
                   </g>
                )}
                {accessory === 'Scarf' && (
                   <path d="M 36 62 Q 50 72 64 62 L 55 85 L 45 85 Z" fill="#ef4444" />
                )}
              </g>
            </g>
          </g>
        </svg>
      );
    };

    const IsoBox = ({ x, y, w, h, z = 0, depth = 20, colors, isGlass, hasBaseboard, renderFront, renderRight, renderTop, className = "" }) => {
      const s = colors || DEFAULT_COLORS.wall;
      return (
        <div className={`absolute ${className}`} style={{ left: x, top: y, width: w, height: h, transform: `translateZ(${z}px)`, transformStyle: 'preserve-3d' }}>
          <div className="absolute inset-0" style={{ background: s.top, transform: `translateZ(${depth}px)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {renderTop && <div className="absolute inset-0">{renderTop}</div>}
          </div>
          <div className="absolute left-0 bottom-0 origin-bottom" style={{ width: '100%', height: depth, background: s.front, transform: `rotateX(-90deg)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {hasBaseboard && <div className="absolute bottom-0 left-0 right-0 h-1.5 bg-[#475569]"></div>}
             {renderFront && <div className="absolute inset-0">{renderFront}</div>}
          </div>
          <div className="absolute right-0 top-0 origin-right" style={{ width: depth, height: '100%', background: s.right, transform: `rotateY(90deg)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {hasBaseboard && <div className="absolute bottom-0 right-0 top-0 w-1.5 bg-[#334155]"></div>}
             {renderRight && <div className="absolute inset-0">{renderRight}</div>}
          </div>
        </div>
      );
    };

    const FreeAvatar = ({ user, x, y, effStatus, onSelectUser, isSelected, isLyingDown = false }) => {
      return (
        <div className="absolute" style={{ left: x * TILE, top: y * TILE, width: TILE, height: TILE, transformStyle: 'preserve-3d' }}>
           <div 
             className={`absolute group ${onSelectUser ? 'cursor-pointer' : ''}`} 
             style={{ left: TILE/2, top: TILE/2, transform: 'translateZ(0px)', transformStyle: 'preserve-3d' }}
             onPointerDown={(e) => { e.stopPropagation(); if (onSelectUser) onSelectUser(user.uid); }}
           >
              <div style={{ transformStyle: 'preserve-3d' }}>
                 {/* Avatar */}
                 <div className={`absolute transition-transform duration-300 ${isLyingDown ? (isSelected ? 'scale-125 z-50' : 'group-hover:scale-110') : (isSelected ? 'scale-125 -translate-y-6 z-50' : 'group-hover:scale-110 group-hover:-translate-y-2')} `} style={{ transform: isLyingDown ? 'translate(-50%, -50%) rotateZ(0deg) rotateX(0deg) translateZ(22px)' : 'rotateZ(-45deg) rotateX(-60deg) translate(-50%, -85%)', transformStyle: 'preserve-3d' }}>
                   <ChibiAvatar 
                     config={user.avatarConfig} 
                     size={48} 
                     effectiveStatus={effStatus}
                     className={isSelected ? 'glow-highlight' : 'drop-shadow-lg'} 
                     style={{ animationDelay: `-${Math.floor(x * y) % 3}s` }} 
                   />
                 </div>
                 
                 {/* Badges & Nameplates (Always facing camera) */}
                 <div className={`absolute transition-transform duration-300 ${isSelected ? 'scale-125 -translate-y-6 z-50' : 'group-hover:scale-110 group-hover:-translate-y-2'}`} style={{ transform: `rotateZ(-45deg) rotateX(-60deg) translate(-50%, ${isLyingDown ? '-30%' : '-85%'})`, transformStyle: 'preserve-3d' }}>
                    {/* Nameplate */}
                    <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-white/95 px-2 py-1 rounded-md shadow-md text-[9px] font-black text-slate-800 uppercase tracking-wider pointer-events-none whitespace-nowrap z-[60] border-b-2 border-slate-200 flex items-center gap-1">
                      {user.displayName || 'Member'}
                    </div>
                    {/* Workspace Status Badge */}
                    <div className="absolute -top-5 -right-5 bg-white rounded-full p-1.5 shadow-lg border border-slate-200 z-10">
                      {effStatus === 'wfh' ? <Home size={12} className="text-indigo-500" /> :
                       effStatus === 'cafe' ? <Coffee size={12} className="text-amber-600" /> :
                       effStatus === 'field' ? <MapPin size={12} className="text-emerald-600" /> :
                       effStatus === 'leave' ? <Plane size={12} className="text-sky-400" /> :
                       effStatus === 'sick' ? <Bed size={12} className="text-rose-500" /> :
                       effStatus === 'mia' ? <UserX size={12} className="text-rose-500" /> :
                       effStatus === 'break' ? <Coffee size={12} className="text-orange-500" /> :
                       <Briefcase size={12} className="text-slate-700" />}
                    </div>
                 </div>
              </div>
           </div>
        </div>
      );
    };

    const DetailedDesk = ({ x, y, dir, user, isExec, colors, onSelectUser, isSelected }) => {
      const px = x * TILE; const py = y * TILE;
      const c = colors || DEFAULT_COLORS;
      
      const effStatus = user ? getEffectiveStatus(user) : 'office';

      return (
        <div className="absolute" style={{ left: px, top: py, width: 2*TILE, height: 1*TILE, transform: `rotateZ(${dir}deg)`, transformStyle: 'preserve-3d' }}>
           
           {/* DEPTH FIX: Avatar placed AT CHAIR HEIGHT (Z=16) so desk surface (Z=26) correctly overlaps legs */}
           {user && (
             <div 
               className={`absolute group ${onSelectUser ? 'cursor-pointer' : ''}`} 
               style={{ left: 10, top: 10, transform: 'translateZ(16px)', transformStyle: 'preserve-3d' }}
               onPointerDown={(e) => { e.stopPropagation(); if (onSelectUser) onSelectUser(user.uid); }}
             >
                <div style={{ transform: `rotateZ(-${dir}deg)`, transformStyle: 'preserve-3d' }}>
                   <div className={`absolute transition-transform duration-300 ${isSelected ? 'scale-125 -translate-y-6 z-50' : 'group-hover:scale-110 group-hover:-translate-y-2'}`} style={{ transform: 'rotateZ(-45deg) rotateX(-60deg) translate(-50%, -85%)', transformStyle: 'preserve-3d' }}>
                     <ChibiAvatar 
                       config={user.avatarConfig} 
                       size={48} 
                       effectiveStatus={effStatus}
                       className={isSelected ? 'glow-highlight' : 'drop-shadow-lg'} 
                       style={{ animationDelay: `-${(x * y) % 3}s` }} 
                     />
                     {/* Nameplate */}
                     <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-white/95 px-2 py-1 rounded-md shadow-md text-[9px] font-black text-slate-800 uppercase tracking-wider pointer-events-none whitespace-nowrap z-[60] border-b-2 border-slate-200 flex items-center gap-1">
                       {user.displayName || 'Member'}
                     </div>
                     {/* Workspace Status Badge */}
                     <div className="absolute -top-5 -right-5 bg-white rounded-full p-1.5 shadow-lg border border-slate-200 z-10">
                       {effStatus === 'wfh' ? <Home size={12} className="text-indigo-500" /> :
                        effStatus === 'cafe' ? <Coffee size={12} className="text-amber-600" /> :
                        effStatus === 'field' ? <MapPin size={12} className="text-emerald-600" /> :
                        effStatus === 'leave' ? <Plane size={12} className="text-sky-400" /> :
                        effStatus === 'sick' ? <Bed size={12} className="text-rose-500" /> :
                        effStatus === 'mia' ? <UserX size={12} className="text-rose-500" /> :
                        effStatus === 'break' ? <Coffee size={12} className="text-orange-500" /> :
                        <Briefcase size={12} className="text-slate-700" />}
                     </div>
                   </div>
                </div>
             </div>
           )}

           <IsoBox x={60} y={20} w={6} h={6} z={30} depth={8} colors={{top:'#ef4444', front:'#dc2626', right:'#b91c1c'}} renderTop={<div className="w-full h-full bg-red-900 rounded-full border border-red-950"></div>} />
           <IsoBox x={20} y={15} w={15} h={10} z={30} depth={1} colors={{top:'#1e293b', front:'#0f172a', right:'#020617'}} />
           <IsoBox x={10} y={5} w={12} h={16} z={30} depth={2} colors={{top:'#ffffff', front:'#e2e8f0', right:'#cbd5e1'}} renderTop={<div className="w-full h-full border border-slate-300"></div>} />
           <IsoBox x={0} y={0} w={80} h={40} z={26} depth={4} colors={c.desk} />
           <IsoBox x={2} y={2} w={15} h={36} z={0} depth={26} colors={c.desk} />

      if (type === 'coffeeTable') return (
        <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>

      if (type === 'sinkCounter') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={240} h={25} z={0} depth={28} colors={c.counter} /></div>;
      if (type === 'pantryIsland') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={120} h={30} z={0} depth={30} colors={c.counter} /></div>;
      if (type === 'fridge') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={60} h={25} z={0} depth={70} colors={c.fridge} /></div>;
      if (type === 'toiletCubicle') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={160} h={4} z={0} depth={60} colors={c.counter} /></div>;
      
      if (type === 'longTable') return (
        <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>
           {/* Legs */}
           <IsoBox x={10} y={10} w={4} h={4} z={0} depth={22} colors={c.pc} />
           <IsoBox x={146} y={10} w={4} h={4} z={0} depth={22} colors={c.pc} />

            <IsoBox x={7} y={2} w={2} h={12} z={0} depth={2} colors={c.pc} />
            {/* Seat */}
            <IsoBox x={0} y={0} w={16} h={16} z={10} depth={2} colors={c.chair} />
            {/* Backrest (Vertical) */}
            <IsoBox x={0} y={14} w={16} h={2} z={12} depth={14} colors={c.chair} />
         </div>
      );
      if (type === 'stool') return (
        <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>
           {/* Stand */}
           <IsoBox x={5} y={5} w={2} h={2} z={0} depth={22} colors={c.pc} />
           <IsoBox x={0} y={0} w={12} h={12} z={22} depth={3} colors={c.desk} renderTop={<div className="w-full h-full rounded-full border border-slate-700"></div>} />

      );
      if (type === 'whiteboard') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={10} w={60} h={4} z={15} depth={30} colors={c.counter} renderFront={<div className="w-full h-full border-4 border-slate-400 bg-white"></div>} /></div>;
      if (type === 'tvScreen') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={80} h={4} z={30} depth={40} colors={c.pc} renderFront={<div className="w-full h-full border-4 border-black bg-blue-900"></div>} /></div>;
      if (type === 'speaker') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={10} h={10} z={0} depth={40} colors={c.speaker} /></div>;
      if (type === 'boxOpen') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={16} h={16} z={0} depth={14} colors={c.box} renderTop={<div className="w-full h-full bg-black/60 border border-black"></div>} /></div>;
      if (type === 'boxClosed') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={16} h={16} z={0} depth={14} colors={c.box} /></div>;
      if (type === 'bookshelf') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={40} h={16} z={0} depth={60} colors={c.pot} /></div>;
      if (type === 'snackShelf') return <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={0} y={0} w={40} h={15} z={0} depth={60} colors={c.pot} /></div>;
      if (type === 'bush') return (
        <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>
           <IsoBox x={2} y={2} w={36} h={36} z={0} depth={20} colors={{top:'#15803d', front:'#166534', right:'#14532d'}} />
        </div>
      );
      if (type === 'tree') return (
        <div className="absolute" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>
           <IsoBox x={16} y={16} w={8} h={8} z={0} depth={40} colors={{top:'#78350f', front:'#451a03', right:'#451a03'}} />
           <IsoBox x={-10} y={-10} w={60} h={60} z={40} depth={30} colors={{top:'#15803d', front:'#166534', right:'#14532d'}} />
        </div>
      );
      if (type === 'bench') return (
        <div className="absolute" style={{ left: px, top: py, transform: `rotateZ(${rot}deg)`, transformStyle: 'preserve-3d' }}>

    };

    const WallSign = ({ x, y, z, w, text, rot = 0 }) => (
      <div className="absolute" style={{ left: x * TILE, top: y * TILE, transform: `rotateZ(${rot}deg)`, transformStyle: 'preserve-3d' }}>
         <IsoBox x={0} y={0} w={w * TILE} h={4} z={z} depth={15} colors={{top:'#1e293b', front:'#ffffff', right:'#94a3b8'}} renderFront={<div className="w-full h-full border-4 border-slate-300 bg-white flex items-center justify-center" style={{ transform: 'translateZ(1px)' }}><span className="font-black text-slate-800 text-[9px] uppercase tracking-widest leading-none text-center px-1">{(text || '').toString()}</span></div>}/>
      </div>
    );

    const MapEngine = ({ directory, mapZoom, config, onSelectUser, selectedUserId }) => {
      const wrapperRef = useRef(null);
      const panRef = useRef({ x: 0, y: -200 });
      const isDraggingRef = useRef(false);
      const lastMouse = useRef({ x: 0, y: 0 });

      const rooms = config.rooms || FULL_ROOMS;
      const walls = config.walls || FULL_WALLS;
      const props = config.props || FULL_PROPS;
      const signs = config.signs || FULL_SIGNS;
      const officeColors = config.colors || DEFAULT_COLORS;

      useEffect(() => {
        if (wrapperRef.current) {
          wrapperRef.current.style.transform = `translate(${panRef.current.x}px, ${panRef.current.y}px) scale(${mapZoom})`;
        }
      }, [mapZoom]);

      const onPointerDown = (e) => { 
        e.preventDefault(); isDraggingRef.current = true; 
        lastMouse.current = { x: e.clientX, y: e.clientY }; 
        e.currentTarget.setPointerCapture(e.pointerId); 
      };
      const onPointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - lastMouse.current.x; const dy = e.clientY - lastMouse.current.y;
        panRef.current.x = Math.max(Math.min(panRef.current.x + dx, 1500), -1500);
        panRef.current.y = Math.max(Math.min(panRef.current.y + dy, 1500), -1500);
        if (wrapperRef.current) wrapperRef.current.style.transform = `translate(${panRef.current.x}px, ${panRef.current.y}px) scale(${mapZoom})`;
        lastMouse.current = { x: e.clientX, y: e.clientY };
      };
      const onPointerUp = (e) => { isDraggingRef.current = false; e.currentTarget.releasePointerCapture(e.pointerId); };

      const breakUsers = directory.filter(k => getEffectiveStatus(k) === 'break');
      const sickUsers = directory.filter(k => getEffectiveStatus(k) === 'sick');
      const activeUsers = directory.filter(k => !['break', 'sick'].includes(getEffectiveStatus(k)));

      return (
        <div className="w-full h-full overflow-hidden cursor-move touch-none relative select-none bg-sky-200" onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}>
          <div ref={wrapperRef} className="absolute origin-center will-change-transform" style={{ transform: `translate(${panRef.current.x}px, ${panRef.current.y}px) scale(${mapZoom})`, left: '50%', top: '50%' }}>
            <div className="relative shadow-[150px_150px_80px_rgba(0,0,0,0.15)]" style={{ width: MAP_W * TILE, height: MAP_H * TILE, marginLeft: -(MAP_W * TILE) / 2, marginTop: -(MAP_H * TILE) / 2, transform: `rotateX(60deg) rotateZ(45deg)`, transformStyle: 'preserve-3d' }}>
               <div className="absolute rounded-2xl" style={{ left: -4 * TILE, top: -4 * TILE, width: (MAP_W + 8) * TILE, height: (MAP_H + 8) * TILE, background: '#cbd5e1', backgroundImage: `linear-gradient(#94a3b8 2px, transparent 2px), linear-gradient(90deg, #94a3b8 2px, transparent 2px)`, backgroundSize: `${TILE * 2}px ${TILE * 2}px`, transform: 'translateZ(-2px)', border: '4px solid #94a3b8' }}></div>
               
               {rooms.map(room => (<div key={room.id} className="absolute overflow-hidden shadow-inner" style={{ left: room.x * TILE, top: room.y * TILE, width: room.w * TILE, height: room.h * TILE, background: String(room.bg), border: '1px solid rgba(0,0,0,0.1)', transform: 'translateZ(-1px)' }}></div>))}
               
               {walls.map((wall, i) => {
                  const px = wall.x * TILE; const py = wall.y * TILE; const pw = wall.w * TILE; const ph = wall.h * TILE;
                  if (wall.type === 'solid') return <IsoBox key={`wall-${i}`} x={px} y={py} w={pw} h={ph} z={0} depth={80} colors={officeColors.wall} hasBaseboard={true} />;
                  return (<React.Fragment key={`wall-${i}`}>
                     <IsoBox x={px} y={py} w={pw} h={ph} z={0} depth={25} colors={officeColors.wall} hasBaseboard={true} /><IsoBox x={px} y={py} w={pw} h={ph} z={25} depth={55} colors={officeColors.glass} isGlass={true} />
                  </React.Fragment>);
               })}
               
               {rooms.map(room => {
                  const kin = activeUsers.filter(k => k.dept === room.id);
                  return (room.slots || []).map((slot, i) => {
                    if (room.id === 'pantry' || room.id === 'events' || room.id === 'reception' || room.id === 'clinic') return null;
                    return <DetailedDesk key={`${room.id}-${i}`} x={slot.x} y={slot.y} dir={slot.dir} user={kin[i]} isExec={slot.isExec} colors={officeColors} onSelectUser={onSelectUser} isSelected={selectedUserId && kin[i] && kin[i].uid === selectedUserId} />
                  });
               })}

               {/* Map Users Having a Break into the Pantry */}
               {breakUsers.map((u, i) => (
                  <FreeAvatar key={u.uid} user={u} x={21 + (i % 4) * 2} y={22 + Math.floor(i / 4) * 2} effStatus="break" onSelectUser={onSelectUser} isSelected={selectedUserId === u.uid} />
               ))}

               {/* Map Sick Users onto Clinic Beds */}
               {sickUsers.map((u, i) => {
                  const bedIndex = i % 6;
                  const bedX = bedIndex < 3 ? 30.5 : 32.5;
                  const bedY = bedIndex % 3 === 0 ? 28.3 : (bedIndex % 3 === 1 ? 30.6 : 32.9);
                  return <FreeAvatar key={u.uid} user={u} x={bedX + 0.5} y={bedY + 0.6} effStatus="sick" isLyingDown={true} onSelectUser={onSelectUser} isSelected={selectedUserId === u.uid} />;
               })}

               {props.map((p, i) => <DetailedProp key={`prop-${i}`} {...p} colors={officeColors} />)}
               {signs.map((s, i) => <WallSign key={`sign-${s.text}-${i}`} {...s} />)}
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [view, setView] = useState('office'); 
      const [posts, setPosts] = useState([]);
      const [directory, setDirectory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newPost, setNewPost] = useState("");
      const [mapZoom, setMapZoom] = useState(0.8);
      const [officeConfig, setOfficeConfig] = useState({ rooms: FULL_ROOMS, walls: FULL_WALLS, props: FULL_PROPS, signs: FULL_SIGNS, colors: DEFAULT_COLORS });
      const [showAdmin, setShowAdmin] = useState(false);
      const [loginError, setLoginError] = useState("");
      const [toastMessage, setToastMessage] = useState("");

      const [selectedUserId, setSelectedUserId] = useState(null);
      const [projects, setProjects] = useState([]);
      const [newProjectName, setNewProjectName] = useState("");
      const [newProjectDesc, setNewProjectDesc] = useState("");
      const [showUserList, setShowUserList] = useState(false);
      const [rosterGroupBy, setRosterGroupBy] = useState('status');
      const [expandedRosterUser, setExpandedRosterUser] = useState(null);
      const [timeLogs, setTimeLogs] = useState([]);

      // --- New Chat States ---
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatTab, setChatTab] = useState('all'); // 'all', 'dept', 'pm'
      const [pmRecipient, setPmRecipient] = useState(null);
      const [chatInput, setChatInput] = useState('');
      const messagesEndRef = useRef(null);

      const [profileForm, setProfileForm] = useState({
        displayName: '',
        email: '',
        contact: '',
        dept: 'dev',
        workStatus: 'office',
        activeProject: '',
        isTimedIn: false,
        isOnBreak: false,
        avatarConfig: {
          skin: '#ffcbab',
          topColor: '#3b82f6',
          hairColor: '#475569',
          bottomColor: '#1e293b',
          shoeColor: '#0f172a',
          bodyType: 'Standard',
          head: 'Round',
          hair: 'Short',
          eyes: 'Basic',
          eyebrows: 'Standard',
          mouth: 'Smile',
          top: 'Tee',
          bottom: 'Jeans',
          shoes: 'Sneakers',
          accessory: 'None'
        }
      });

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token !== "") { 
              await signInWithCustomToken(auth, __initial_auth_token); 
            } 
          } catch (err) { console.log("Init bypass."); }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, async (u) => {
          if (u) {
            // Guard to prevent creating profiles for unauthorized domains during the brief window before signOut completes
            if (u.email && !u.email.endsWith('@inventi.ph') && !u.email.endsWith('@inventi.asia')) {
              return;
            }

            const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', u.uid);
            const docSnap = await getDoc(userRef);
            
            let isNewUser = false;
            
            // If the document doesn't exist or has no displayName, it's a first-time setup
            if (!docSnap.exists() || !docSnap.data().displayName) {
              isNewUser = true;
              const docData = docSnap.data() || {};
              const resolvedEmail = u.email || docData.email || '';
              const defaultName = resolvedEmail ? resolvedEmail.split('@')[0] : 'KinMember';
              
              const defaultAvatar = {
                skin: '#ffcbab', topColor: '#3b82f6', hairColor: '#475569', bottomColor: '#1e293b', shoeColor: '#0f172a',
                bodyType: 'Standard', head: 'Round', hair: 'Short', eyes: 'Basic', eyebrows: 'Standard', mouth: 'Smile',
                top: 'Tee', bottom: 'Jeans', shoes: 'Sneakers', accessory: 'None'
              };

              await setDoc(userRef, { 
                uid: u.uid, 
                email: resolvedEmail,
                displayName: defaultName,
                avatarConfig: docData.avatarConfig || defaultAvatar,
                lastSeen: serverTimestamp() 
              }, { merge: true });
              
              // Force the view to profile for new users
              setView('profile');
              setToastMessage("Welcome! Please set up your avatar.");
              setTimeout(() => setToastMessage(""), 4000);
            } else {
              await setDoc(userRef, { uid: u.uid, lastSeen: serverTimestamp() }, { merge: true });
            }

            setUser(u);
          } else { 
            setUser(null); 
            setUserProfile(null);
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubPosts = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'posts'), (snapshot) => setPosts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        const unsubProfiles = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'profiles'), (snapshot) => {
          const allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setDirectory(allProfiles);
          const currentProfile = allProfiles.find(p => p.uid === user.uid);
          if (currentProfile) {
            setUserProfile(currentProfile);
            setProfileForm({
              displayName: currentProfile.displayName || '',
              email: currentProfile.email || '',
              contact: currentProfile.contact || '',
              dept: currentProfile.dept || 'dev',
              workStatus: currentProfile.workStatus || 'office',
              activeProject: currentProfile.activeProject || '',
              isTimedIn: currentProfile.isTimedIn || false,
              isOnBreak: currentProfile.isOnBreak || false,
              avatarConfig: currentProfile.avatarConfig || profileForm.avatarConfig
            });
          }
        });
        
        const unsubProjects = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'projects'), (snapshot) => {
          setProjects(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        
        const unsubTimeLogs = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'timeLogs'), (snapshot) => {
          setTimeLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubMessages = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'messages'), (snapshot) => {
          setChatMessages(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        return () => { unsubPosts(); unsubProfiles(); unsubProjects(); unsubTimeLogs(); unsubMessages(); };
      }, [user]);

      // Handle Enter Key for Chat
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Enter' && view === 'office') {
            const activeTag = document.activeElement?.tagName?.toLowerCase();
            if (activeTag !== 'input' && activeTag !== 'textarea') {
              e.preventDefault();
              setIsChatOpen(prev => !prev);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view]);

      const formatTime = (ts) => {
        if (!ts) return '--:--';
        let date;
        if (ts.toDate) date = ts.toDate();
        else if (ts.seconds) date = new Date(ts.seconds * 1000);
        else date = new Date(ts);
        
        if (isNaN(date.getTime())) return '--:--';
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      const handleCreatePost = async (e) => {
        e.preventDefault(); if (!newPost.trim() || !user) return;
        await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'posts'), { content: newPost, authorId: user.uid, authorName: userProfile?.displayName || 'Anonymous', createdAt: serverTimestamp() });
        setNewPost("");
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if(!chatInput.trim() || !user) return;

        let channelId = 'all';
        if (chatTab === 'dept') channelId = userProfile?.dept || 'general';
        if (chatTab === 'pm' && pmRecipient) {
           channelId = [user.uid, pmRecipient.uid].sort().join('_');
        }

        await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'messages'), {
           text: chatInput.trim(),
           senderId: user.uid,
           senderName: userProfile?.displayName || 'Unknown',
           channelId: channelId,
           type: chatTab,
           timestamp: serverTimestamp()
        });
        setChatInput('');
      };

      const getFilteredMessages = () => {
        let filtered = [];
        if (chatTab === 'all') {
          filtered = chatMessages.filter(m => m.channelId === 'all');
        } else if (chatTab === 'dept') {
          filtered = chatMessages.filter(m => m.channelId === (userProfile?.dept || 'general'));
        } else if (chatTab === 'pm' && pmRecipient) {
          const pmChannel = [user.uid, pmRecipient.uid].sort().join('_');
          filtered = chatMessages.filter(m => m.channelId === pmChannel);
        }
        return filtered.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
      };
      
      const activeMessages = getFilteredMessages();

      // Scroll to bottom when messages update
      useEffect(() => {
        if (isChatOpen) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [activeMessages, isChatOpen]);

      const handleManualSave = async () => {
        await setDoc(doc(db, 'artifacts', appIdString, 'public', 'data', 'officeConfig', 'current'), officeConfig);
        setToastMessage("Layout synced!"); setTimeout(() => setToastMessage(""), 3000);
      };

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!user) return;
        const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          await updateDoc(userRef, { ...profileForm, updatedAt: serverTimestamp() });
          setToastMessage("Profile updated!");
          setTimeout(() => setToastMessage(""), 3000);
        } catch (error) {
          setToastMessage("Update failed.");
          setTimeout(() => setToastMessage(""), 3000);
        }
      };

      const handleQuickStatusUpdate = async (field, value) => {
        if (!user) return;
        const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          await updateDoc(userRef, {
            [field]: value,
            updatedAt: serverTimestamp()
          });
          setToastMessage("Status Updated!");
          setTimeout(() => setToastMessage(""), 2000);
        } catch (error) {
          console.error(error);
        }
      };

      const logTimeAction = async (actionType) => {
        if (!user) return;
        await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'timeLogs'), {
          userId: user.uid,
          action: actionType,
          timestamp: serverTimestamp()
        });
      };

      const handleTimeToggle = async (timingIn) => {
        if (!user) return;
        const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          await updateDoc(userRef, {
            isTimedIn: timingIn,
            isOnBreak: false,
            [timingIn ? 'lastTimeIn' : 'lastTimeOut']: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          await logTimeAction(timingIn ? 'TIME_IN' : 'TIME_OUT');
          setToastMessage(timingIn ? "Timed In Successfully!" : "Timed Out Successfully!");
          setTimeout(() => setToastMessage(""), 3000);
        } catch (error) {
          console.error(error);
          setToastMessage("Error updating time.");
          setTimeout(() => setToastMessage(""), 3000);
        }
      };

      const handleBreakToggle = async (goingOnBreak) => {
        if (!user) return;
        const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          await updateDoc(userRef, {
            isOnBreak: goingOnBreak,
            updatedAt: serverTimestamp()
          });
          await logTimeAction(goingOnBreak ? 'BREAK_START' : 'BREAK_END');
          setToastMessage(goingOnBreak ? "Break Started" : "Break Ended");
          setTimeout(() => setToastMessage(""), 3000);
        } catch (error) {
          console.error(error);
        }
      };

      const handleCreateProject = async (e) => {
        e.preventDefault();
        if (!newProjectName.trim() || !user) return;
        try {
          await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'projects'), {
            name: newProjectName,
            description: newProjectDesc,
            createdBy: user.uid,
            status: 'Active',
            createdAt: serverTimestamp()
          });
          setNewProjectName("");
          setNewProjectDesc("");
          setToastMessage("Project Created!");
          setTimeout(() => setToastMessage(""), 3000);
        } catch (err) {
          setToastMessage("Error creating project.");
          setTimeout(() => setToastMessage(""), 3000);
        }
      };

      const updateAvatar = (key, value) => {
        setProfileForm(prev => ({
          ...prev,
          avatarConfig: { ...prev.avatarConfig, [key]: value }
        }));
      };

      const CategoryBlock = ({ title, featKey }) => (
        <div className="space-y-4">
          <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-slate-200 pb-2">{title}</p>
          <div className="flex flex-wrap gap-2">
            {AVATAR_OPTIONS[featKey].map(opt => (
              <button 
                key={opt} type="button"
                onClick={(e) => { e.preventDefault(); updateAvatar(featKey, opt); }}
                className={`px-3 py-2 text-[10px] font-bold rounded-lg transition-all border-2 ${profileForm.avatarConfig[featKey] === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}`}
              >
                {opt.replace(/([A-Z])/g, ' $1').trim()}
              </button>
            ))}
          </div>
        </div>
      );

      const handleGoogleLogin = async () => {
        setLoginError("Connecting to Google..."); 
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        
        try { 
          const result = await signInWithPopup(auth, provider); 
          const userEmail = result.user.email || "";
          
          if (!userEmail.endsWith('@inventi.ph') && !userEmail.endsWith('@inventi.asia')) {
            await signOut(auth);
            setLoginError(`Access denied (${userEmail}). Please use an @inventi.ph or @inventi.asia account.`);
            return;
          }
          setLoginError("");
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain') {
            setLoginError("Sandbox domain detected. Simulating @inventi.ph login...");
            try {
              const anonResult = await signInAnonymously(auth);
              const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', anonResult.user.uid);
              await setDoc(userRef, { email: 'sandbox.tester@inventi.ph', lastSeen: serverTimestamp() }, { merge: true });
              setLoginError("");
            } catch(e) {
              console.error(e);
              setLoginError("Simulated login failed.");
            }
          } else if (error.code === 'auth/popup-closed-by-user') {
            setLoginError("Login popup was closed before finishing.");
          } else if (error.code === 'auth/network-request-failed') {
            setLoginError("Network error. Ensure you have an active connection.");
          } else { 
            console.error("Login Error:", error);
            setLoginError(`Login failed: ${error.message}`); 
          }
        }
      };

      const renderMemberRow = (member) => {
        const isExpanded = expandedRosterUser === member.uid;
        const effStatus = getEffectiveStatus(member);
        const statusObj = WORK_STATUSES.find(s => s.id === effStatus) || WORK_STATUSES[0];
        const StatusIcon = statusObj.icon;
        const proj = projects.find(p => p.id === member.activeProject);

        return (
          <div key={member.uid} className={`bg-slate-50 rounded-2xl border ${isExpanded ? 'border-indigo-300 shadow-md' : 'border-slate-100 hover:shadow-md'} transition-all cursor-pointer overflow-hidden flex flex-col`} onClick={() => setExpandedRosterUser(isExpanded ? null : member.uid)}>
             <div className="p-4 flex items-center gap-4">
               <div className="w-12 h-12 rounded-xl bg-white border-2 border-slate-100 shadow-sm flex items-center justify-center overflow-hidden shrink-0 relative">
                  <ChibiAvatar config={member.avatarConfig} size={50} effectiveStatus={effStatus} className="translate-y-2" />
               </div>
               <div className="flex-1 min-w-0">
                  <h4 className="font-black text-slate-800 text-sm truncate">{member.displayName || 'Member'}</h4>
                  <div className="flex items-center gap-1.5 mt-1">
                     <span className={`w-2 h-2 rounded-full ${member.isTimedIn ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>
                     <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider truncate">
                        {member.isTimedIn ? `In: ${formatTime(member.lastTimeIn)}` : `Out: ${formatTime(member.lastTimeOut)}`}
                     </p>
                  </div>
               </div>
             </div>
             
             {isExpanded && (
               <div className="px-5 pb-5 pt-3 border-t border-slate-100 bg-white grid grid-cols-2 gap-4 animate-in slide-in-from-top-2">
                 <div>
                   <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Status</p>
                   <p className="text-xs font-bold text-slate-700 flex items-center gap-1 mt-1">
                     <StatusIcon size={12} className={effStatus === 'mia' ? 'text-rose-500' : effStatus === 'break' ? 'text-orange-500' : 'text-indigo-500'}/> {statusObj.label}
                   </p>
                 </div>
                 <div>
                   <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Project</p>
                   <p className="text-xs font-bold text-slate-700 mt-1 truncate" title={proj ? proj.name : 'None'}>{proj ? proj.name : 'None'}</p>
                 </div>
                 <div>
                   <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Time In</p>
                   <p className="text-xs font-bold text-slate-700 mt-1">{formatTime(member.lastTimeIn)}</p>
                 </div>
                 <div>
                   <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Time Out</p>
                   <p className="text-xs font-bold text-slate-700 mt-1">{formatTime(member.lastTimeOut)}</p>
                 </div>
                 <div className="col-span-2 pt-2 border-t border-slate-50 flex">
                   <button onClick={(e) => { e.stopPropagation(); setShowUserList(false); setView('office'); setSelectedUserId(member.uid); }} className="w-full text-[10px] font-black uppercase text-indigo-600 bg-indigo-50 px-3 py-2 rounded-xl hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2">
                     <MapIcon size={14} /> Locate in Office
                   </button>
                 </div>
               </div>
             )}
          </div>
        );
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-900 font-sans"><MapIcon className="w-16 h-16 text-indigo-400 animate-pulse" /></div>;

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-400 to-sky-200 font-sans relative overflow-hidden">
             <style>{`@keyframes fc { 0% { transform: translateX(-20vw); opacity: 0; } 10% { opacity: 0.9; } 90% { opacity: 0.9; } 100% { transform: translateX(110vw); opacity: 0; } } .c1 { animation: fc 45s linear infinite; top: 12%; } .c2 { animation: fc 60s linear infinite 15s; top: 30%; }`}</style>
             <div className="absolute inset-0 pointer-events-none">
                <Cloud className="absolute text-white/60 w-32 h-32 c1 -left-32" fill="currentColor" stroke="none" />
                <Cloud className="absolute text-white/50 w-24 h-24 c2 -left-32 scale-75" fill="currentColor" stroke="none" />
             </div>
             <div className="bg-white/20 backdrop-blur-2xl p-10 rounded-3xl shadow-[0_8px_32px_rgba(0,0,0,0.15)] z-10 w-full max-sm:mx-4 max-w-sm flex flex-col items-center border border-white/40">
                <div className="bg-indigo-600 p-4 rounded-2xl shadow-lg border-b-4 border-indigo-900 mb-6">
                  <svg width="44" height="44" viewBox="0 0 48 48" fill="none" className="text-white">
                    <path d="M6 42H42" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/><path d="M12 42V14L24 6L36 14V42" stroke="currentColor" strokeWidth="3"/><circle cx="24" cy="20" r="4" fill="currentColor" /><circle cx="14" cy="32" r="4" fill="currentColor" /><circle cx="34" cy="32" r="4" fill="currentColor" /><path d="M17 29L21 23M31 29L27 23M18 32H30" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                  </svg>
                </div>
                <h1 className="text-4xl font-black tracking-tighter text-slate-800 mb-2 drop-shadow-sm text-center">KinHub</h1>
                <p className="text-slate-700 font-bold mb-8 text-center text-sm drop-shadow-sm px-4 uppercase tracking-tight">Close ties. Great vibes. Welcome home.</p>
                {loginError && <div className="w-full bg-amber-50/80 backdrop-blur-sm text-amber-800 p-3 rounded-xl text-[10px] font-bold mb-4 text-left border border-amber-200 flex items-start gap-2"><ShieldAlert size={16} className="shrink-0 mt-0.5" /><span className="leading-tight">{loginError}</span></div>}
                <button onClick={handleGoogleLogin} className="w-full flex items-center justify-center gap-3 bg-white/90 border border-white/60 p-4 rounded-xl font-black text-xs uppercase tracking-wider text-slate-700 shadow-sm hover:bg-white transition-all">
                  <svg className="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                  Sign in with Google
                </button>
             </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#94a3b8] text-slate-800 flex flex-col md:flex-row overflow-hidden font-sans">
          
          {/* Global CSS for Animations & Glow Effects */}
          <style>{`
            @keyframes avatar-breathe {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-2.5px); }
            }
            .breathe-target {
              animation: avatar-breathe 3s ease-in-out infinite;
              animation-delay: var(--anim-delay, 0s);
            }
            
            .glow-highlight {
              filter: drop-shadow(0px -1px 0px #818cf8) drop-shadow(0px 1px 0px #818cf8) drop-shadow(1px 0px 0px #818cf8) drop-shadow(-1px 0px 0px #818cf8) drop-shadow(0 0 10px #4f46e5);
              animation: glow-pulse 1.5s infinite alternate ease-in-out;
            }
            @keyframes glow-pulse {
              0% { filter: drop-shadow(0px -1px 0px #a5b4fc) drop-shadow(0px 1px 0px #a5b4fc) drop-shadow(1px 0px 0px #a5b4fc) drop-shadow(-1px 0px 0px #a5b4fc) drop-shadow(0 0 5px #6366f1); }
              100% { filter: drop-shadow(0px -1.5px 0px #818cf8) drop-shadow(0px 1.5px 0px #818cf8) drop-shadow(1.5px 0px 0px #818cf8) drop-shadow(-1.5px 0px 0px #818cf8) drop-shadow(0 0 15px #4f46e5); }
            }

            .glow-red {
              filter: drop-shadow(0px -1px 0px #fb7185) drop-shadow(0px 1px 0px #fb7185) drop-shadow(1px 0px 0px #fb7185) drop-shadow(-1px 0px 0px #fb7185) drop-shadow(0 0 10px #e11d48);
              animation: glow-red-pulse 2s infinite alternate ease-in-out;
            }
            @keyframes glow-red-pulse {
              0% { filter: drop-shadow(0px -1px 0px #fca5a5) drop-shadow(0px 1px 0px #fca5a5) drop-shadow(1px 0px 0px #fca5a5) drop-shadow(-1px 0px 0px #fca5a5) drop-shadow(0 0 5px #ef4444); }
              100% { filter: drop-shadow(0px -1.5px 0px #fb7185) drop-shadow(0px 1.5px 0px #fb7185) drop-shadow(1.5px 0px 0px #fb7185) drop-shadow(-1.5px 0px 0px #fb7185) drop-shadow(0 0 15px #e11d48); }
            }
            
            .ghost-avatar {
              opacity: 0.45;
              filter: grayscale(100%) sepia(20%) hue-rotate(180deg) drop-shadow(0 0 8px rgba(255,255,255,0.8));
            }
            
            /* Custom Scrollbar for Chat */
            .chat-scroll::-webkit-scrollbar { width: 6px; }
            .chat-scroll::-webkit-scrollbar-track { background: transparent; }
            .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
            .chat-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
          `}</style>

          <nav className="hidden md:flex flex-col w-72 h-screen p-6 bg-white border-r-8 border-slate-300 z-50 shadow-2xl relative shrink-0">
            <div className="flex items-center gap-3 mb-12 mt-2"><div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg border-b-4 border-indigo-900"><Layout className="text-white h-6 w-6" /></div><span className="text-3xl font-black tracking-tighter">KinHub</span></div>
            <div className="space-y-3 flex-1 pr-2 overflow-y-auto">
              <button onClick={() => {setView('office'); setSelectedUserId(null); setIsChatOpen(false); }} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'office' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><MapIcon size={18} /> Office</button>
              <button onClick={() => setView('projects')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'projects' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><FolderKanban size={18} /> Projects</button>
              <button onClick={() => setView('home')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'home' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><MessageSquare size={18} /> Feed</button>
              <button onClick={() => setView('directory')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'directory' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><Users size={18} /> Network</button>
              <button onClick={() => setView('history')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'history' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><HistoryIcon size={18} /> History</button>
              <button onClick={() => setView('profile')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'profile' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><UserCircle size={18} /> Profile</button>
              <div className="pt-8 mt-8 border-t border-slate-100 space-y-3">
                <button onClick={() => setShowAdmin(!showAdmin)} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase border-2 ${showAdmin ? 'bg-slate-800 text-white' : 'bg-white text-slate-500'}`}><Settings size={18} /> Zone Admin</button>
                <button onClick={() => signOut(auth)} className="w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase text-red-50 hover:bg-red-50"><LogOut size={18} /> Sign Out</button>
              </div>
            </div>
          </nav>
          <main className="flex-1 relative h-screen bg-sky-200 overflow-hidden">
            {toastMessage && <div className="absolute bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] text-xs font-black uppercase transition-all animate-in slide-in-from-right-4">{toastMessage}</div>}
            
            {view === 'office' && (
              <div className="w-full h-full relative overflow-hidden">
                 
                 {/* Floating Users Online Button */}
                 <button onClick={() => setShowUserList(true)} className="absolute top-6 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-xl px-6 py-3 rounded-full shadow-lg border border-slate-200 z-40 flex items-center gap-3 hover:scale-105 transition-transform">
                   <div className="relative flex items-center justify-center">
                      <span className="absolute w-3 h-3 bg-emerald-400 rounded-full animate-ping"></span>
                      <span className="w-2 h-2 bg-emerald-500 rounded-full z-10"></span>
                   </div>
                   <span className="font-black text-xs uppercase tracking-widest text-slate-700">{directory.filter(u => u.isTimedIn).length} / {directory.length} Online</span>
                 </button>

                 {showAdmin && (
                    <div className="absolute top-6 left-6 w-80 bg-white/95 backdrop-blur-xl p-6 rounded-[2.5rem] shadow-2xl z-50 border border-slate-200">
                       <h3 className="text-xl font-black text-slate-800 mb-6 flex items-center gap-2"><Settings className="text-indigo-500" /> Environment</h3>
                       <button onClick={handleManualSave} className="w-full py-3 bg-indigo-600 text-white rounded-xl text-xs font-black uppercase shadow-lg hover:bg-indigo-500 transition-colors">Sync Layout to Cloud</button>
                    </div>
                 )}
                 <div className="absolute top-6 right-6 z-40 bg-white p-2 rounded-2xl shadow-xl flex border border-slate-200">
                    <button onClick={() => setMapZoom(z => Math.max(0.3, z - 0.2))} className="p-3 hover:bg-slate-50 rounded-xl font-black">-</button>
                    <div className="px-4 py-3 font-black text-[10px] text-slate-400 uppercase flex items-center">Zoom</div>
                    <button onClick={() => setMapZoom(z => Math.min(3.0, z + 0.2))} className="p-3 hover:bg-slate-50 rounded-xl font-black">+</button>
                 </div>
                 
                 <MapEngine directory={directory} mapZoom={mapZoom} config={officeConfig} onSelectUser={setSelectedUserId} selectedUserId={selectedUserId} />
                 
                 {/* Floating Chat Button */}
                 <button 
                   onClick={() => setIsChatOpen(true)} 
                   className={`absolute bottom-6 right-6 z-40 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-[0_10px_25px_rgba(79,70,229,0.5)] hover:scale-105 hover:bg-indigo-500 transition-all ${isChatOpen ? 'hidden' : 'flex'} items-center justify-center`}
                 >
                   <MessageCircle size={24} />
                 </button>

                 {/* CHAT PANEL */}
                 <div className={`absolute top-0 right-0 w-[350px] sm:w-[400px] h-full bg-white/95 backdrop-blur-3xl shadow-[-20px_0_40px_rgba(0,0,0,0.1)] z-50 flex flex-col transform transition-transform duration-300 ${isChatOpen ? 'translate-x-0' : 'translate-x-full'}`} onPointerDown={e => e.stopPropagation()}>
                    <div className="p-6 border-b border-slate-100 flex items-center justify-between shrink-0">
                       <h3 className="font-black text-xl text-slate-800 tracking-tight flex items-center gap-2"><MessageCircle className="text-indigo-600"/> Team Comms</h3>
                       <button onClick={() => setIsChatOpen(false)} className="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-200 transition-colors"><X size={16} /></button>
                    </div>
                    
                    <div className="flex border-b border-slate-100 shrink-0">
                       <button onClick={() => { setChatTab('all'); setPmRecipient(null); }} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'all' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>All</button>
                       <button onClick={() => { setChatTab('dept'); setPmRecipient(null); }} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'dept' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>Dept</button>
                       <button onClick={() => setChatTab('pm')} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'pm' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>PM</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 chat-scroll flex flex-col gap-4">
                       {chatTab === 'pm' && !pmRecipient ? (
                          <div className="space-y-2">
                             <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-2">Select a Colleague</p>
                             {directory.filter(u => u.uid !== user.uid).sort((a,b) => (a.displayName||'').localeCompare(b.displayName||'')).map(u => (
                                <button key={u.uid} onClick={() => setPmRecipient(u)} className="w-full flex items-center gap-4 p-3 rounded-2xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-colors text-left group">
                                   <div className="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shrink-0 group-hover:scale-110 transition-transform">
                                      <ChibiAvatar config={u.avatarConfig} size={40} className="translate-y-2" />
                                   </div>
                                   <div>
                                      <h4 className="font-black text-sm text-slate-800">{u.displayName || 'Member'}</h4>
                                      <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{DEPT_NAMES_LOOKUP[u.dept] || 'Explorer'}</p>
                                   </div>
                                </button>
                             ))}
                          </div>
                       ) : (
                          <>
                             {chatTab === 'pm' && pmRecipient && (
                               <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-2 shrink-0">
                                  <button onClick={() => setPmRecipient(null)} className="p-2 hover:bg-white rounded-xl shadow-sm text-slate-400 transition-colors"><ChevronLeft size={16}/></button>
                                  <div>
                                     <h4 className="font-black text-sm text-slate-800">Chat with {pmRecipient.displayName}</h4>
                                  </div>
                               </div>
                             )}
                             {activeMessages.length === 0 ? (
                               <div className="flex-1 flex flex-col items-center justify-center text-slate-400 opacity-50">
                                  <MessageSquare size={48} className="mb-4" />
                                  <p className="font-black text-xs uppercase tracking-widest">No Messages Yet</p>
                               </div>
                             ) : (
                               activeMessages.map(msg => {
                                 const isMe = msg.senderId === user.uid;
                                 return (
                                   <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                      <div className={`max-w-[85%] rounded-2xl px-5 py-3 ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm border border-slate-200'}`}>
                                         {!isMe && <p className="text-[10px] font-black uppercase tracking-wider mb-1 opacity-50">{msg.senderName}</p>}
                                         <p className="text-sm font-medium leading-relaxed">{msg.text}</p>
                                      </div>
                                      <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1 px-1">{formatTime(msg.timestamp)}</span>
                                   </div>
                                 );
                               })
                             )}
                             <div ref={messagesEndRef} />
                          </>
                       )}
                    </div>

                    {!(chatTab === 'pm' && !pmRecipient) && (
                       <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-100 bg-white shrink-0">
                          <div className="relative flex items-center">
                             <input 
                               type="text" 
                               value={chatInput} 
                               onChange={e => setChatInput(e.target.value)} 
                               placeholder={chatTab === 'all' ? "Message entire company..." : chatTab === 'dept' ? `Message ${DEPT_NAMES_LOOKUP[userProfile?.dept] || 'Department'}...` : "Type private message..."}
                               className="w-full bg-slate-50 border border-slate-200 rounded-full pl-6 pr-14 py-4 text-sm font-medium text-slate-800 outline-none focus:border-indigo-400 transition-colors shadow-inner"
                             />
                             <button type="submit" disabled={!chatInput.trim()} className="absolute right-2 p-2 bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-500 disabled:opacity-50 disabled:hover:bg-indigo-600 transition-colors">
                                <Send size={16} className="-ml-0.5" />
                             </button>
                          </div>
                       </form>
                    )}
                 </div>

                 {/* Character Profile Overlay Panel */}
                 {selectedUserId && directory.find(k => k.uid === selectedUserId) && (
                   <div className="absolute right-6 top-24 w-80 bg-white/95 backdrop-blur-2xl p-6 rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.3)] z-40 border border-white/60 animate-in slide-in-from-right-8">
                     <button onClick={() => setSelectedUserId(null)} className="absolute top-6 right-6 p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-200 transition-colors"><X size={16} /></button>
                     {(() => {
                       const selUser = directory.find(k => k.uid === selectedUserId);
                       const effStatus = getEffectiveStatus(selUser);
                       const statusObj = WORK_STATUSES.find(s => s.id === effStatus) || WORK_STATUSES[0];
                       const StatusIcon = statusObj.icon;
                       const proj = projects.find(p => p.id === selUser.activeProject);
                       return (
                         <div className="flex flex-col items-center text-center">
                           <div className="w-28 h-28 rounded-[2rem] bg-indigo-50 flex items-center justify-center mb-4 border-4 border-white shadow-inner overflow-hidden relative">
                             <ChibiAvatar config={selUser.avatarConfig} size={110} effectiveStatus={effStatus} className="relative z-10 drop-shadow-md translate-y-6" />
                           </div>
                           <h3 className="text-xl font-black text-slate-800">{selUser.displayName || 'Kin Member'}</h3>
                           <p className="text-indigo-600 font-black uppercase text-[10px] tracking-widest mt-1 mb-6">{DEPT_NAMES_LOOKUP[selUser.dept] || 'Explorer'}</p>
                           
                           <div className="w-full bg-slate-50 rounded-3xl p-5 mb-6 space-y-4 text-left border border-slate-100 shadow-inner">
                             <div className="flex items-center gap-3">
                               <div className="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100"><StatusIcon size={16} className={effStatus === 'mia' ? 'text-rose-500' : effStatus === 'break' ? 'text-orange-500' : 'text-indigo-600'} /></div>
                               <div>
                                 <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Current Status</p>
                                 <p className="text-xs font-bold text-slate-700">{statusObj.label}</p>
                               </div>
                             </div>
                             {proj && (
                               <div className="flex items-center gap-3 pt-4 border-t border-slate-200">
                                 <div className="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100"><FolderKanban size={16} className="text-indigo-600" /></div>
                                 <div className="overflow-hidden">
                                   <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Working On</p>
                                   <p className="text-xs font-bold text-slate-700 truncate w-40">{proj.name}</p>
                                 </div>
                               </div>
                             )}
                           </div>

                           <div className="w-full space-y-3 text-left px-3">
                             <div className="flex items-center gap-4 text-slate-500 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
