                   eyes === 'WideOpen' ? <g fill="#1c1917" stroke="none"><circle cx="36" cy="44" r="5" /><circle cx="64" cy="44" r="5" /></g> :
                   eyes === 'ClosedHappy' ? <g fill="none" strokeWidth="2.5"><path d="M 32 44 Q 36 38 40 44" /><path d="M 60 44 Q 64 38 68 44" /></g> :
                   eyes === 'Winking' ? <g fill="none" strokeWidth="2.5"><circle cx="36" cy="44" r="3.5" fill="#1c1917" stroke="none" /><path d="M 60 44 Q 64 38 68 44" /></g> :
                   eyes === 'Tired' ? <g fill="none" strokeWidth="2.5"><path d="M 32 44 Q 36 40 40 44" /><path d="M 60 44 Q 64 40 68 44" /><circle cx="36" cy="45" r="2" fill="#1c1917" stroke="none" /><circle cx="64" cy="45" r="2" fill="#1c1917" stroke="none" /></g> :
                   eyes === 'Sparkle' ? <g fill="#1c1917" stroke="none"><circle cx="36" cy="44" r="4" /><circle cx="37" cy="42" r="1.5" fill="white" /><circle cx="64" cy="44" r="4" /><circle cx="65" cy="42" r="1.5" fill="white" /></g> :
                   eyes === 'Dot' ? <g fill="#1c1917" stroke="none"><circle cx="36" cy="44" r="2" /><circle cx="64" cy="44" r="2" /></g> :
                   eyes === 'Lashes' ? <g fill="none" strokeWidth="2"><circle cx="36" cy="44" r="3.5" fill="#1c1917" stroke="none" /><path d="M 32 42 L 28 38 M 40 42 L 44 38" /><circle cx="64" cy="44" r="3.5" fill="#1c1917" stroke="none" /><path d="M 60 42 L 56 38 M 68 42 L 72 38" /></g> :
                   <g fill="#1c1917" stroke="none"><circle cx="36" cy="44" r="3.5" /><circle cx="64" cy="44" r="3.5" /></g>}
                </g>
                <g id="mouth" fill="none" strokeWidth="2.5">
                  {mouth === 'Open' ? <path d="M 44 56 A 6 6 0 0 0 56 56 Z" fill="#991b1b" strokeWidth="1.5" /> : 
                   mouth === 'Line' ? <path d="M 45 56 H 55" strokeWidth="2" /> : 
                   mouth === 'Frown' ? <path d="M 45 58 Q 50 54 55 58" /> : 
                   mouth === 'Smirk' ? <path d="M 44 57 Q 52 60 56 53" /> : 
                   mouth === 'Laugh' ? <path d="M 44 54 Q 50 64 56 54 Z" fill="#991b1b" strokeWidth="1.5" /> : 
                   mouth === 'Surprised' ? <ellipse cx="50" cy="56" rx="3" ry="4" fill="#1c1917" stroke="none" /> : 
                   mouth === 'Tongue' ? <g><path d="M 44 54 Q 50 60 56 54" /><path d="M 48 57 A 2 3 0 0 0 52 57 Z" fill="#f43f5e" stroke="none" /></g> : 
                   mouth === 'Teeth' ? <path d="M 44 54 Q 50 60 56 54 Z" fill="white" strokeWidth="1.5" /> : 
                   <path d="M 44 54 Q 50 60 56 54" />}
                </g>
                <g id="details">
                  {details === 'Freckles' && <g fill="#92400e" stroke="none" opacity="0.6"><circle cx="32" cy="48" r="1"/><circle cx="35" cy="49" r="1"/><circle cx="38" cy="48" r="1"/><circle cx="62" cy="48" r="1"/><circle cx="65" cy="49" r="1"/><circle cx="68" cy="48" r="1"/></g>}
                  {details === 'Blush' && <g fill="#f43f5e" opacity="0.3" stroke="none"><ellipse cx="32" cy="48" rx="5" ry="3"/><ellipse cx="68" cy="48" rx="5" ry="3"/></g>}
                  {details === 'Scar' && <path d="M 28 40 L 34 45 L 30 50" stroke="#991b1b" strokeWidth="1.5" opacity="0.5" fill="none" />}
                  {details === 'FacialHair' && <g fill={hairColor} stroke="none" opacity="0.85"><path d="M 38 51 Q 50 48 62 51 Q 50 53 38 51 Z" /><path d="M 30 58 Q 50 82 70 58 Q 50 68 30 58 Z" /></g>}
                </g>
              </g>
              {hair !== 'Bald' && (
                <g id="front-hair" fill={hairColor} clipPath={['Cap', 'Beanie'].includes(accessory) ? "url(#hat-clip)" : undefined}>
                  {hair === 'Short' && <path d="M 15 55 L 20 50 L 20 40 C 25 30 35 25 50 30 C 65 25 75 30 80 40 L 80 50 L 85 55 C 85 -10 15 -10 15 55 Z" />}
                  {hair === 'Spiky' && <path d="M 15 55 L 20 50 L 20 30 L 35 40 L 50 25 L 65 40 L 80 30 L 80 50 L 85 55 L 95 20 L 80 -5 L 65 10 L 50 -15 L 35 10 L 20 -5 L 5 20 Z" />}
                  {hair === 'Undercut' && <path d="M 18 45 C 18 -10 82 -10 82 30 C 70 15 30 15 18 45 Z" />}
                  {hair === 'Curly' && <g><path d="M 15 55 A 10 10 0 0 1 10 40 A 12 12 0 0 1 18 22 A 14 14 0 0 1 35 8 A 16 16 0 0 1 50 0 A 16 16 0 0 1 65 8 A 14 14 0 0 1 82 22 A 12 12 0 0 1 90 40 A 10 10 0 0 1 85 55 A 12 12 0 0 1 70 45 A 10 10 0 0 1 60 42 A 12 12 0 0 1 50 40 A 12 12 0 0 1 40 42 A 10 10 0 0 1 30 45 A 12 12 0 0 1 15 55 Z"/><path d="M 25 42 A 4 4 0 0 1 30 46 M 40 38 A 5 5 0 0 1 48 40 M 55 42 A 4 4 0 0 1 62 46 M 65 32 A 5 5 0 0 1 72 28 M 20 28 A 4 4 0 0 1 25 22 M 35 22 A 5 5 0 0 1 45 22 M 55 18 A 5 5 0 0 1 65 22 M 45 30 A 4 4 0 0 1 50 36" fill="none" stroke="#1c1917" strokeWidth="1.5" opacity="0.6"/>{[[30,25], [60,20], [45,15], [20,35], [75,35]].map((pos, i) => (<path key={i} d={`M ${pos[0]} ${pos[1]} A 4 4 0 1 1 ${pos[0]} ${pos[1]+8} A 2.5 2.5 0 1 1 ${pos[0]} ${pos[1]+3}`} fill="none" stroke="#1c1917" strokeWidth="1.5" opacity="0.4" />))}</g>}
                  {hair === 'Bob' && <path d="M 12 45 C 12 -10 88 -10 88 45 L 82 65 C 75 55 75 30 50 30 C 25 30 25 55 18 65 Z" />}
                  {(hair === 'Long' || hair === 'Braids' || hair === 'Ponytail' || hair === 'HalfUp' || hair === 'Buns' || hair === 'LongWavy') && <path d="M 15 45 C 15 -10 85 -10 85 45 C 75 25 25 25 15 45 Z" />}
                  {hair === 'Messy' && <g><path d="M 15 55 L 20 50 L 20 40 C 35 25 65 25 80 40 L 80 50 L 85 55 L 88 35 L 82 25 L 88 15 L 75 5 L 60 10 L 50 0 L 40 10 L 25 5 L 12 15 L 18 25 L 12 35 Z" /><path d="M 20 15 Q 18 12 22 10 T 20 5 M 80 15 Q 82 12 78 10 T 80 5 M 40 5 Q 38 2 42 0 T 40 -5 M 60 5 Q 62 2 58 0 T 60 -5 M 30 20 Q 28 17 32 15 T 30 10 M 70 20 Q 72 17 68 15 T 70 10" stroke={hairColor} strokeWidth="2.5" strokeLinecap="round" fill="none" /></g>}
                  {hair === 'SlickedBack' && <g><path d="M 15 55 L 20 50 L 20 40 C 35 35 65 35 80 40 L 80 50 L 85 55 C 85 -10 15 -10 15 55 Z" /><path d="M 30 35 Q 50 20 70 35 M 40 37 Q 50 25 60 37" fill="none" stroke="#1c1917" strokeWidth="1.5" opacity="0.4"/></g>}
                  {hair === 'Afro' && <path d="M 15 45 C 15 -10 85 -10 85 45 A 10 10 0 0 1 75 35 A 10 10 0 0 1 62 30 A 12 12 0 0 1 50 28 A 12 12 0 0 1 38 30 A 10 10 0 0 1 25 35 A 10 10 0 0 1 15 45 Z" />}
                  {hair === 'Curtain' && <g><path d="M 15 55 L 20 55 L 20 35 C 30 35 40 45 48 35 L 50 30 L 52 35 C 60 45 70 35 80 35 L 80 55 L 85 55 C 85 10 70 -5 50 -5 C 30 -5 15 10 15 55 Z" /><path d="M 50 -5 L 50 30" stroke="#1c1917" strokeWidth="2.5" fill="none" /></g>}
                  {hair === 'OneSide' && <g><path d="M 15 55 L 20 55 L 20 30 L 25 25 C 40 45 70 45 80 30 L 80 55 L 85 55 C 85 -5 60 -10 35 -5 L 28 -5 C 15 0 15 25 15 55 Z" /><path d="M 28 -5 Q 26 10 25 25 M 30 15 Q 50 35 75 25" fill="none" stroke="#1c1917" strokeWidth="2.5" opacity="0.7"/></g>}
                  {hair === 'Faded' && <g><path d="M 16 42 C 16 -10 84 -10 84 42 L 84 45 Q 50 35 16 45 Z" fill={hairColor} stroke={hairColor}/><path d="M 16 42 L 22 42 L 20 55 L 16 60 Z M 84 42 L 78 42 L 80 55 L 84 60 Z" fill={`url(#fadeSideburns-${hairColor.replace('#','')})`} stroke="none" /></g>}
                  {hair === 'Taper' && <path d="M 15 55 L 20 50 L 20 40 C 25 30 75 30 80 40 L 80 50 L 85 55 C 85 -10 15 -10 15 55 Z" />}
                  {hair === 'Fringe' && <path d="M 15 45 C 15 -10 85 -10 85 45 L 82 35 C 60 35 40 35 18 35 Z" />}
                  {hair === 'Crew' && <path d="M 15 55 L 20 50 L 20 40 C 30 30 70 30 80 40 L 80 50 L 85 55 C 85 -5 15 -5 15 55 Z" />}
                  {hair === 'Shag' && <g><path d="M 15 65 L 20 60 L 20 40 Q 35 45 45 35 L 50 30 L 55 35 Q 65 45 80 40 L 80 60 L 85 65 L 88 45 L 82 20 L 90 10 L 75 -5 L 50 -10 L 25 -5 L 10 10 L 18 20 L 12 45 Z" /><path d="M 50 -10 L 50 30 M 25 40 L 30 30 M 45 40 L 50 30 M 65 40 L 60 30" stroke="#1c1917" strokeWidth="2" fill="none" opacity="0.6"/></g>}
                </g>
              )}
              <g id="accessories">
                {accessory === 'Mask' && <g><path d="M 18 48 L 30 54 M 82 48 L 70 54" stroke="white" strokeWidth="2" /><path d="M 28 50 Q 50 44 72 50 L 68 68 Q 50 78 32 68 Z" fill="white" stroke="#e2e8f0" strokeWidth="1.5" strokeLinejoin="round" /><path d="M 32 56 Q 50 52 68 56 M 34 62 Q 50 58 66 62" fill="none" stroke="#e2e8f0" strokeWidth="1" /></g>}
                {accessory === 'Glasses' && <g fill="rgba(255,255,255,0.3)"><rect x="28" y="38" width="18" height="14" rx="4" /><rect x="54" y="38" width="18" height="14" rx="4" /><path d="M 46 42 H 54" /></g>}
                {accessory === 'Headphones' && <g fill="#1e293b"><path d="M 18 40 Q 18 5 50 5 Q 82 5 82 40" fill="none" stroke="#1e293b" strokeWidth="6" /><rect x="13" y="30" width="10" height="25" rx="5" /><rect x="77" y="30" width="10" height="25" rx="5" /></g>}
                {accessory === 'Scarf' && <path d="M 36 62 Q 50 72 64 62 L 55 85 L 45 85 Z" fill="#ef4444" />}
                {accessory === 'Cap' && <g><path d="M 18 28 A 32 30 0 0 1 82 28 Z" fill={topColor} /><path d="M 10 28 Q 50 38 90 28 Q 50 22 10 28 Z" fill={bottomColor} /><circle cx="50" cy="2" r="4" fill={bottomColor} /></g>}
                {accessory === 'Beanie' && <g><path d="M 20 36 C 20 5, 80 5, 80 36 Z" fill={topColor} /><rect x="18" y="32" width="64" height="8" rx="3" fill={bottomColor} /><circle cx="50" cy="8" r="7" fill={bottomColor} /></g>}
                {accessory === 'Crown' && <g transform="translate(0, -5)"><path d="M 25 35 L 20 10 L 35 22 L 50 5 L 65 22 L 80 10 L 75 35 Z" fill="#facc15" stroke="#ca8a04" strokeWidth="1.5" strokeLinejoin="round" /><ellipse cx="50" cy="35" rx="25" ry="3" fill="#facc15" stroke="#ca8a04" strokeWidth="1.5" /><circle cx="20" cy="10" r="2" fill="#ef4444" stroke="none" /><circle cx="50" cy="5" r="2.5" fill="#38bdf8" stroke="none" /><circle cx="80" cy="10" r="2" fill="#ef4444" stroke="none" /></g>}
                {accessory === 'Necklace' && <g><path d="M 38 65 Q 50 80 62 65" fill="none" stroke="#facc15" strokeWidth="2" /><circle cx="50" cy="73" r="3.5" fill="#38bdf8" stroke="none" /></g>}
                {accessory === 'Earrings' && <g><circle cx="22" cy="55" r="2" fill="#facc15" stroke="none" /><circle cx="78" cy="55" r="2" fill="#facc15" stroke="none" /></g>}
                {accessory === 'Bag' && <g><path d={`M 25 65 L ${tX+tW+5} 100`} fill="none" stroke="#1c1917" strokeWidth="3" /><rect x={tX+tW} y="90" width="15" height="15" rx="2" fill={bottomColor} strokeWidth="2" /></g>}
              </g>
            </g>
          </g>
        </svg>
      );
    };

    const IsoBox = ({ x, y, w, h, z = 0, depth = 20, colors, isGlass, hasBaseboard, renderFront, renderRight, renderTop, className = "" }) => {
      const s = colors || DEFAULT_COLORS.wall;
      return (
        <div className={`absolute pointer-events-none ${className}`} style={{ left: x, top: y, width: w, height: h, transform: `translateZ(${z}px)`, transformStyle: 'preserve-3d' }}>
          <div className="absolute inset-0" style={{ background: s.top, transform: `translateZ(${depth}px)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {renderTop && <div className="absolute inset-0 pointer-events-auto">{renderTop}</div>}
          </div>
          <div className="absolute left-0 bottom-0 origin-bottom" style={{ width: '100%', height: depth, background: s.front, transform: `rotateX(-90deg)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {hasBaseboard && <div className="absolute bottom-0 left-0 right-0 h-1.5 bg-[#475569]"></div>}
             {renderFront && <div className="absolute inset-0 pointer-events-auto">{renderFront}</div>}
          </div>
          <div className="absolute right-0 top-0 origin-right" style={{ width: depth, height: '100%', background: s.right, transform: `rotateY(90deg)`, border: isGlass ? '1px solid rgba(255,255,255,0.2)' : '1px solid rgba(0,0,0,0.1)' }}>
             {hasBaseboard && <div className="absolute bottom-0 right-0 top-0 w-1.5 bg-[#334155]"></div>}
             {renderRight && <div className="absolute inset-0 pointer-events-auto">{renderRight}</div>}
          </div>
        </div>
      );
    };

    const FreeAvatar = ({ user, x, y, effStatus, onSelectUser, isSelected, isLyingDown = false }) => {
      return (
        <div className="absolute" style={{ left: x * TILE, top: y * TILE, width: TILE, height: TILE, transformStyle: 'preserve-3d' }}>
           <div className={`absolute group pointer-events-auto ${onSelectUser ? 'cursor-pointer' : ''}`} style={{ left: TILE/2, top: TILE/2, transform: 'translateZ(0px)', transformStyle: 'preserve-3d' }} onPointerDown={(e) => { e.stopPropagation(); if (onSelectUser) onSelectUser(user.uid); }}>
              <div className="absolute -left-6 -top-16 w-12 h-20 bg-transparent z-[100]"></div>
              <div style={{ transformStyle: 'preserve-3d' }}>
                 <div className={`absolute w-[48px] h-[72px] transition-transform duration-300 ${isLyingDown ? (isSelected ? 'scale-125 z-50' : 'group-hover:scale-110') : (isSelected ? 'scale-125 -translate-y-6 z-50' : 'group-hover:scale-110 group-hover:-translate-y-2')} `} style={{ transform: isLyingDown ? 'translate(-50%, -50%) rotateZ(0deg) rotateX(0deg) translateZ(22px)' : 'rotateZ(-45deg) rotateX(-60deg) translate(-50%, -85%)', transformStyle: 'preserve-3d' }}>
                   <ChibiAvatar config={user.avatarConfig} size={48} effectiveStatus={effStatus} className={isSelected ? 'glow-highlight' : 'drop-shadow-lg'} style={{ animationDelay: `-${Math.floor(x * y) % 3}s` }} />
                 </div>
                 <div className={`absolute w-[48px] h-[72px] transition-transform duration-300 ${isSelected ? 'scale-125 -translate-y-6 z-50' : 'group-hover:scale-110 group-hover:-translate-y-2'}`} style={{ transform: `rotateZ(-45deg) rotateX(-60deg) translate(-50%, ${isLyingDown ? '-30%' : '-85%'})`, transformStyle: 'preserve-3d' }}>
                    <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-white/95 px-2 py-1 rounded-md shadow-md text-[9px] font-black text-slate-800 uppercase tracking-wider pointer-events-none whitespace-nowrap z-[60] border-b-2 border-slate-200 flex items-center gap-1">{user.displayName || 'Member'}</div>
                    <div className="absolute -top-5 -right-5 bg-white rounded-full p-1.5 shadow-lg border border-slate-200 z-10">
                      {effStatus === 'wfh' ? <Home size={12} className="text-indigo-500" /> : effStatus === 'cafe' ? <Coffee size={12} className="text-amber-600" /> : effStatus === 'field' ? <MapPin size={12} className="text-emerald-600" /> : effStatus === 'leave' ? <Plane size={12} className="text-sky-400" /> : effStatus === 'sick' ? <Bed size={12} className="text-rose-500" /> : effStatus === 'event' ? <Music size={12} className="text-pink-500" /> : effStatus === 'mia' ? <UserX size={12} className="text-rose-500" /> : effStatus === 'break' ? <Coffee size={12} className="text-orange-500" /> : <Briefcase size={12} className="text-slate-700" />}
                    </div>
                 </div>
              </div>
           </div>
        </div>
      );
    };

    const DetailedDesk = ({ x, y, dir, user, isExec, colors, onSelectUser, isSelected }) => {
      const px = x * TILE; const py = y * TILE; const c = colors || DEFAULT_COLORS; const effStatus = user ? getEffectiveStatus(user) : 'office';
      return (
        <div className="absolute pointer-events-none" style={{ left: px, top: py, width: 2*TILE, height: 1*TILE, transform: `rotateZ(${dir}deg)`, transformStyle: 'preserve-3d' }}>
           {user && (
             <div className={`absolute group pointer-events-auto ${onSelectUser ? 'cursor-pointer' : ''}`} style={{ left: 40, top: 58, transform: 'translateZ(16px)', transformStyle: 'preserve-3d' }} onPointerDown={(e) => { e.stopPropagation(); if (onSelectUser) onSelectUser(user.uid); }}>
                <div className="absolute -left-6 -top-16 w-12 h-20 bg-transparent z-[100]"></div>

                     <ChibiAvatar config={user.avatarConfig} size={48} effectiveStatus={effStatus} className={isSelected ? 'glow-highlight' : 'drop-shadow-lg'} style={{ animationDelay: `-${(x * y) % 3}s` }} />
                     <div className="absolute -top-12 left-1/2 -translate-x-1/2 bg-white/95 px-2 py-1 rounded-md shadow-md text-[9px] font-black text-slate-800 uppercase tracking-wider pointer-events-none whitespace-nowrap z-[60] border-b-2 border-slate-200 flex items-center gap-1">{user.displayName || 'Member'}</div>
                     <div className="absolute -top-5 -right-5 bg-white rounded-full p-1.5 shadow-lg border border-slate-200 z-10">
                       {effStatus === 'wfh' ? <Home size={12} className="text-indigo-500" /> : effStatus === 'cafe' ? <Coffee size={12} className="text-amber-600" /> : effStatus === 'field' ? <MapPin size={12} className="text-emerald-600" /> : effStatus === 'leave' ? <Plane size={12} className="text-sky-400" /> : effStatus === 'sick' ? <Bed size={12} className="text-rose-500" /> : effStatus === 'event' ? <Music size={12} className="text-pink-500" /> : effStatus === 'mia' ? <UserX size={12} className="text-rose-500" /> : effStatus === 'break' ? <Coffee size={12} className="text-orange-500" /> : <Briefcase size={12} className="text-slate-700" />}

           <IsoBox x={20} y={15} w={15} h={10} z={30} depth={1} colors={{top:'#1e293b', front:'#0f172a', right:'#020617'}} />
           <IsoBox x={10} y={5} w={12} h={16} z={30} depth={2} colors={{top:'#ffffff', front:'#e2e8f0', right:'#cbd5e1'}} renderTop={<div className="w-full h-full border border-slate-300"></div>} />
           <IsoBox x={0} y={0} w={80} h={40} z={26} depth={4} colors={c.desk} />
           <IsoBox x={2} y={2} w={15} h={36} z={0} depth={26} colors={c.desk} />
           <IsoBox x={55} y={2} w={23} h={36} z={0} depth={26} colors={c.filing} />
           {isExec && <IsoBox x={-40} y={0} w={40} h={80} z={26} depth={4} colors={c.desk} />}
           <IsoBox x={65} y={10} w={10} h={24} z={30} depth={20} colors={c.pc} /> 
           <IsoBox x={35} y={18} w={30} h={4} z={38} depth={16} colors={c.pc} renderFront={<div className="w-full h-full border-2 border-black bg-blue-900 flex flex-col p-1"><div className="w-full h-1 bg-white/20 mb-1"></div></div>}/>
           <div className="absolute" style={{ left: 30, top: 48, width: 20, height: 20, transformStyle: 'preserve-3d' }}>
              <IsoBox x={7} y={7} w={2} h={2} z={0} depth={10} colors={c.chair} />
              <IsoBox x={2} y={7} w={12} h={2} z={0} depth={2} colors={c.pc} />
              <IsoBox x={7} y={2} w={2} h={12} z={0} depth={2} colors={c.pc} />
              <IsoBox x={0} y={0} w={16} h={16} z={10} depth={2} colors={c.chair} />
              <IsoBox x={0} y={14} w={16} h={2} z={12} depth={14} colors={c.chair} />

    };

    const DetailedProp = ({ x, y, type, rot = 0, z = 0, colors }) => {
      const px = x * TILE; const py = y * TILE; const c = colors || DEFAULT_COLORS;
      
      if (type === 'waterDispenser') return (
         <div className="absolute pointer-events-none" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}>
            <IsoBox x={4} y={4} w={12} h={12} z={0} depth={22} colors={{top:'#f8fafc', front:'#cbd5e1', right:'#94a3b8'}} />
            <IsoBox x={6} y={16} w={8} h={2} z={10} depth={2} colors={{top:'#334155', front:'#1e293b', right:'#0f172a'}} />
            <IsoBox x={5} y={5} w={10} h={10} z={22} depth={16} colors={{top:'rgba(56, 189, 248, 0.4)', front:'rgba(14, 165, 233, 0.5)', right:'rgba(2, 132, 199, 0.5)'}} isGlass={true} />
         </div>
      );
      if (type === 'plant') return <div className="absolute pointer-events-none" style={{ left: px, top: py, transformStyle: 'preserve-3d' }}><IsoBox x={4} y={4} w={16} h={16} z={z} depth={15} colors={c.pot} renderTop={<div className="w-full h-full bg-[#15803d] rounded-full scale-150 border border-green-900"></div>}/></div>;

      const rooms = config.rooms || FULL_ROOMS; const walls = config.walls || FULL_WALLS; const props = config.props || FULL_PROPS; const signs = config.signs || FULL_SIGNS; const officeColors = config.colors || DEFAULT_COLORS;

      useEffect(() => { if (wrapperRef.current) { wrapperRef.current.style.transform = `translate3d(${panRef.current.x}px, ${panRef.current.y}px, 0) scale(${mapZoom})`; } }, [mapZoom]);

      const onPointerDown = (e) => { e.preventDefault(); isDraggingRef.current = true; lastMouse.current = { x: e.clientX, y: e.clientY }; e.currentTarget.setPointerCapture(e.pointerId); };
      const onPointerMove = (e) => { if (!isDraggingRef.current) return; const dx = e.clientX - lastMouse.current.x; const dy = e.clientY - lastMouse.current.y; panRef.current.x = Math.max(Math.min(panRef.current.x + dx, 1500), -1500); panRef.current.y = Math.max(Math.min(panRef.current.y + dy, 1500), -1500); if (wrapperRef.current) wrapperRef.current.style.transform = `translate3d(${panRef.current.x}px, ${panRef.current.y}px, 0) scale(${mapZoom})`; lastMouse.current = { x: e.clientX, y: e.clientY }; };
      const onPointerUp = (e) => { isDraggingRef.current = false; e.currentTarget.releasePointerCapture(e.pointerId); };

      const breakUsers = directory.filter(k => getEffectiveStatus(k) === 'break');
      const sickUsers = directory.filter(k => getEffectiveStatus(k) === 'sick');
      const eventUsers = directory.filter(k => getEffectiveStatus(k) === 'event');
      const activeUsers = directory.filter(k => !['break', 'sick', 'event'].includes(getEffectiveStatus(k)));

      return (
        <div className={`w-full h-full overflow-hidden cursor-move touch-none relative select-none ${mapBgClass}`} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}>
          <div ref={wrapperRef} className="absolute origin-center will-change-transform" style={{ transform: `translate3d(${panRef.current.x}px, ${panRef.current.y}px, 0) scale(${mapZoom})`, left: '50%', top: '50%' }}>
            <div className="relative shadow-[150px_150px_80px_rgba(0,0,0,0.15)] pointer-events-none" style={{ width: MAP_W * TILE, height: MAP_H * TILE, marginLeft: -(MAP_W * TILE) / 2, marginTop: -(MAP_H * TILE) / 2, transform: `rotateX(60deg) rotateZ(45deg)`, transformStyle: 'preserve-3d' }}>
               {/* Expanded Background bounds to support the larger nature perimeter safely */}
               <div className="absolute rounded-2xl" style={{ left: -6 * TILE, top: -6 * TILE, width: (MAP_W + 12) * TILE, height: (MAP_H + 12) * TILE, background: '#cbd5e1', backgroundImage: `linear-gradient(#94a3b8 2px, transparent 2px), linear-gradient(90deg, #94a3b8 2px, transparent 2px)`, backgroundSize: `${TILE * 2}px ${TILE * 2}px`, transform: 'translateZ(-2px)', border: '4px solid #94a3b8' }}></div>
               {rooms.map(room => (<div key={room.id} className="absolute overflow-hidden shadow-inner" style={{ left: room.x * TILE, top: room.y * TILE, width: room.w * TILE, height: room.h * TILE, background: String(room.bg), border: '1px solid rgba(0,0,0,0.1)', transform: 'translateZ(-1px)' }}></div>))}
               {walls.map((wall, i) => { const px = wall.x * TILE; const py = wall.y * TILE; const pw = wall.w * TILE; const ph = wall.h * TILE; if (wall.type === 'solid') return <IsoBox key={`wall-${i}`} x={px} y={py} w={pw} h={ph} z={0} depth={80} colors={officeColors.wall} hasBaseboard={true} />; return (<React.Fragment key={`wall-${i}`}><IsoBox x={px} y={py} w={pw} h={ph} z={0} depth={25} colors={officeColors.wall} hasBaseboard={true} /><IsoBox x={px} y={py} w={pw} h={ph} z={25} depth={55} colors={officeColors.glass} isGlass={true} /></React.Fragment>); })}
               {rooms.map(room => { const kin = activeUsers.filter(k => k.dept === room.id); return (room.slots || []).map((slot, i) => { if (room.id === 'pantry' || room.id === 'events' || room.id === 'reception' || room.id === 'clinic') return null; return <DetailedDesk key={`${room.id}-${i}`} x={slot.x} y={slot.y} dir={slot.dir} user={kin[i]} isExec={slot.isExec} colors={officeColors} onSelectUser={onSelectUser} isSelected={selectedUserId && kin[i] && kin[i].uid === selectedUserId} /> }); })}
               
               {/* Map Users Having a Break into the Pantry */}
               {breakUsers.map((u, i) => (<FreeAvatar key={u.uid} user={u} x={28 + (i % 5) * 3} y={25 + Math.floor(i / 5) * 3} effStatus="break" onSelectUser={onSelectUser} isSelected={selectedUserId === u.uid} />))}
               
               {/* Map Event Users into the Event Place */}
               {eventUsers.map((u, i) => (<FreeAvatar key={u.uid} user={u} x={4 + (i % 8) * 1.5} y={44.5 + Math.floor(i / 8) * 1.5} effStatus="event" onSelectUser={onSelectUser} isSelected={selectedUserId === u.uid} />))}
               
               {/* Map Sick Users onto Clinic Beds */}
               {sickUsers.map((u, i) => { const bedIndex = i % 6; const bedX = bedIndex < 3 ? 37.5 : 41.5; const bedY = bedIndex % 3 === 0 ? 31 : (bedIndex % 3 === 1 ? 33 : 35); return <FreeAvatar key={u.uid} user={u} x={bedX + 0.5} y={bedY + 0.6} effStatus="sick" isLyingDown={true} onSelectUser={onSelectUser} isSelected={selectedUserId === u.uid} />; })}
               
               {props.map((p, i) => <DetailedProp key={`prop-${i}`} {...p} colors={officeColors} />)}
               {signs.map((s, i) => <WallSign key={`sign-${s.text}-${i}`} {...s} />)}
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [view, setView] = useState('office'); 
      const [posts, setPosts] = useState([]);
      const [directory, setDirectory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newPost, setNewPost] = useState("");
      const [mapZoom, setMapZoom] = useState(0.8);
      const [officeConfig, setOfficeConfig] = useState({ rooms: FULL_ROOMS, walls: FULL_WALLS, props: FULL_PROPS, signs: FULL_SIGNS, colors: DEFAULT_COLORS });
      const [showAdmin, setShowAdmin] = useState(false);
      const [loginError, setLoginError] = useState("");
      const [toastMessage, setToastMessage] = useState("");
      const [isOnboarding, setIsOnboarding] = useState(false);

      const [selectedUserId, setSelectedUserId] = useState(null);
      const [projects, setProjects] = useState([]);
      const [newProjectName, setNewProjectName] = useState("");
      const [newProjectDesc, setNewProjectDesc] = useState("");
      const [showUserList, setShowUserList] = useState(false);
      const [rosterGroupBy, setRosterGroupBy] = useState('status');
      const [expandedRosterUser, setExpandedRosterUser] = useState(null);
      const [timeLogs, setTimeLogs] = useState([]);
      const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
      const hasUnsavedChangesRef = useRef(false);
      const [pendingNavView, setPendingNavView] = useState(null);
      const [showSaveConfirm, setShowSaveConfirm] = useState(false);
      const [pendingTimeAction, setPendingTimeAction] = useState(null);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatTab, setChatTab] = useState('all'); 
      const [pmRecipient, setPmRecipient] = useState(null);
      const [chatInput, setChatInput] = useState('');
      const messagesEndRef = useRef(null);

      const [phTime, setPhTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setPhTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const phHour = parseInt(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Manila', hour: 'numeric', hour12: false }).format(phTime), 10);
      let mapBgClass = "bg-sky-200 transition-colors duration-1000";
      if (phHour >= 5 && phHour < 7) mapBgClass = "bg-orange-200 transition-colors duration-1000"; // Dawn
      else if (phHour >= 7 && phHour < 17) mapBgClass = "bg-sky-200 transition-colors duration-1000"; // Day
      else if (phHour >= 17 && phHour < 19) mapBgClass = "bg-orange-300 transition-colors duration-1000"; // Sunset
      else if (phHour >= 19 && phHour < 20) mapBgClass = "bg-indigo-900 transition-colors duration-1000"; // Dusk
      else mapBgClass = "bg-slate-900 transition-colors duration-1000"; // Night

      const formattedTime = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(phTime);
      const formattedDate = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Manila', weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' }).format(phTime);

      const [profileForm, setProfileForm] = useState({ displayName: '', email: '', contact: '', dept: 'dev', roleLevel: 'mid', workStatus: 'office', activeProject: '', isTimedIn: false, isOnBreak: false, avatarConfig: { skin: '#ffcbab', topColor: '#3b82f6', hairColor: '#475569', bottomColor: '#1e293b', shoeColor: '#0f172a', bodyType: 'Standard', head: 'Round', hair: 'Short', eyes: 'Basic', eyebrows: 'Standard', mouth: 'Smile', details: 'None', top: 'Tee', bottom: 'Jeans', shoes: 'Sneakers', accessory: 'None' } });

      useEffect(() => {
        const initAuth = async () => { try { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token !== "") { await signInWithCustomToken(auth, __initial_auth_token); } } catch (err) { console.log("Init bypass."); } };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, async (u) => {
          if (u) {
            if (u.email && !u.email.endsWith('@inventi.ph') && !u.email.endsWith('@inventi.asia')) return;
            const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', u.uid);
            const docSnap = await getDoc(userRef);
            
            if (!docSnap.exists() || docSnap.data().isSetupComplete === false || !docSnap.data().displayName) {
              const docData = docSnap.exists() ? docSnap.data() : {}; 
              const resolvedEmail = u.email || docData.email || ''; 
              const defaultName = resolvedEmail ? resolvedEmail.split('@')[0] : 'KinMember';
              const defaultAvatar = { skin: '#ffcbab', topColor: '#3b82f6', hairColor: '#475569', bottomColor: '#1e293b', shoeColor: '#0f172a', bodyType: 'Standard', head: 'Round', hair: 'Short', eyes: 'Basic', eyebrows: 'Standard', mouth: 'Smile', details: 'None', top: 'Tee', bottom: 'Jeans', shoes: 'Sneakers', accessory: 'None' };
              await setDoc(userRef, { uid: u.uid, email: resolvedEmail, displayName: docData.displayName || defaultName, roleLevel: docData.roleLevel || 'mid', avatarConfig: docData.avatarConfig || defaultAvatar, isSetupComplete: false, lastSeen: serverTimestamp() }, { merge: true });
              setIsOnboarding(true);
              setView('profile'); 
              setToastMessage("Welcome! Please set up your avatar."); 
              setTimeout(() => setToastMessage(""), 4000);
            } else { 
              await setDoc(userRef, { uid: u.uid, lastSeen: serverTimestamp() }, { merge: true }); 
              setIsOnboarding(false);
            }
            setUser(u);
          } else { 
             setUser(null); 
             setUserProfile(null); 
             setIsOnboarding(false); 
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubPosts = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'posts'), (snapshot) => setPosts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        const unsubProfiles = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'profiles'), (snapshot) => {
          const allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); setDirectory(allProfiles);
          const currentProfile = allProfiles.find(p => p.uid === user.uid);
          if (currentProfile) {
            setUserProfile(currentProfile);
            if (currentProfile.isSetupComplete === false) {
              setIsOnboarding(true);
              if (view !== 'profile') setView('profile');
            }
            if (!hasUnsavedChangesRef.current) {
              setProfileForm({ displayName: currentProfile.displayName || '', email: currentProfile.email || '', contact: currentProfile.contact || '', dept: currentProfile.dept || 'dev', roleLevel: currentProfile.roleLevel || 'mid', workStatus: currentProfile.workStatus || 'office', activeProject: currentProfile.activeProject || '', isTimedIn: currentProfile.isTimedIn || false, isOnBreak: currentProfile.isOnBreak || false, avatarConfig: currentProfile.avatarConfig || profileForm.avatarConfig });
            }
          }
        });
        const unsubProjects = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'projects'), (snapshot) => { setProjects(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))); });
        const unsubTimeLogs = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'timeLogs'), (snapshot) => { setTimeLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))); });
        const unsubMessages = onSnapshot(collection(db, 'artifacts', appIdString, 'public', 'data', 'messages'), (snapshot) => { setChatMessages(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))); });
        return () => { unsubPosts(); unsubProfiles(); unsubProjects(); unsubTimeLogs(); unsubMessages(); };
      }, [user]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Enter' && view === 'office') {
            const activeTag = document.activeElement?.tagName?.toLowerCase();
            if (activeTag !== 'input' && activeTag !== 'textarea') { e.preventDefault(); setIsChatOpen(prev => !prev); }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view]);

      const formatTime = (ts) => { if (!ts) return '--:--'; let date; if (ts.toDate) date = ts.toDate(); else if (ts.seconds) date = new Date(ts.seconds * 1000); else date = new Date(ts); if (isNaN(date.getTime())) return '--:--'; return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };

      const handleCreatePost = async (e) => { e.preventDefault(); if (!newPost.trim() || !user) return; await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'posts'), { content: newPost, authorId: user.uid, authorName: userProfile?.displayName || 'Anonymous', createdAt: serverTimestamp() }); setNewPost(""); };

      const setUnsaved = (val) => { setHasUnsavedChanges(val); hasUnsavedChangesRef.current = val; };

      const handleNavigation = (targetView) => {
        if (view === 'profile' && hasUnsavedChanges) { setPendingNavView(targetView); } 
        else { setView(targetView); setSelectedUserId(null); setIsChatOpen(false); }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault(); if(!chatInput.trim() || !user) return;
        let channelId = 'all';
        if (chatTab === 'dept') channelId = userProfile?.dept || 'general';
        if (chatTab === 'pm' && pmRecipient) { channelId = [user.uid, pmRecipient.uid].sort().join('_'); }
        await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'messages'), { text: chatInput.trim(), senderId: user.uid, senderName: userProfile?.displayName || 'Unknown', channelId: channelId, type: chatTab, timestamp: serverTimestamp() });
        setChatInput('');
      };

      const getFilteredMessages = () => {
        let filtered = [];
        if (chatTab === 'all') { filtered = chatMessages.filter(m => m.channelId === 'all'); } 
        else if (chatTab === 'dept') { filtered = chatMessages.filter(m => m.channelId === (userProfile?.dept || 'general')); } 
        else if (chatTab === 'pm' && pmRecipient) { const pmChannel = [user.uid, pmRecipient.uid].sort().join('_'); filtered = chatMessages.filter(m => m.channelId === pmChannel); }
        return filtered.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
      };
      
      const activeMessages = getFilteredMessages();

      useEffect(() => { if (isChatOpen) { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); } }, [activeMessages, isChatOpen]);

      const handleManualSave = async () => { await setDoc(doc(db, 'artifacts', appIdString, 'public', 'data', 'officeConfig', 'current'), officeConfig); setToastMessage("Layout synced!"); setTimeout(() => setToastMessage(""), 3000); };

      const executeSaveProfile = async () => {
        if (!user) return;
        const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try { 
          await updateDoc(userRef, { ...profileForm, isSetupComplete: true, updatedAt: serverTimestamp() }); 
          setUnsaved(false); 
          if (isOnboarding) {
             setIsOnboarding(false);
             setView('office');
             setToastMessage("Setup complete! Welcome to the office.");
          } else {
             setToastMessage("Profile updated!"); 
          }
          setTimeout(() => setToastMessage(""), 3000); 
        } 
        catch (error) { setToastMessage("Update failed."); setTimeout(() => setToastMessage(""), 3000); }
        setShowSaveConfirm(false);
      };

      const handleUpdateProfile = (e) => { if (e) e.preventDefault(); setShowSaveConfirm(true); };

      const logTimeAction = async (actionType, details = null) => { if (!user) return; await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'timeLogs'), { userId: user.uid, action: actionType, details: details, timestamp: serverTimestamp() }); };

      const handleQuickStatusUpdate = async (field, value) => {
        if (!user) return; const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          await updateDoc(userRef, { [field]: value, updatedAt: serverTimestamp() });
          if (field === 'workStatus') { const statusLabel = WORK_STATUSES.find(s => s.id === value)?.label || value; await logTimeAction('STATUS_UPDATE', statusLabel); } 
          else if (field === 'activeProject') { const projName = projects.find(p => p.id === value)?.name || 'None / Open Work'; await logTimeAction('PROJECT_UPDATE', projName); }
          setToastMessage("Status Updated!"); setTimeout(() => setToastMessage(""), 2000);
        } catch (error) { console.error(error); }
      };

      const requestTimeAction = (actionStr) => { setPendingTimeAction(actionStr); };

      const executePendingTimeAction = async () => {
        if (!user || !pendingTimeAction) return; const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', user.uid);
        try {
          if (pendingTimeAction === 'TIME_IN' || pendingTimeAction === 'TIME_OUT') {
            const timingIn = pendingTimeAction === 'TIME_IN';
            await updateDoc(userRef, { isTimedIn: timingIn, isOnBreak: false, [timingIn ? 'lastTimeIn' : 'lastTimeOut']: serverTimestamp(), updatedAt: serverTimestamp() });
            await logTimeAction(pendingTimeAction); setToastMessage(timingIn ? "Timed In Successfully!" : "Timed Out Successfully!");
          } else if (pendingTimeAction === 'BREAK_START' || pendingTimeAction === 'BREAK_END') {
            const goingOnBreak = pendingTimeAction === 'BREAK_START';
            await updateDoc(userRef, { isOnBreak: goingOnBreak, updatedAt: serverTimestamp() });
            await logTimeAction(pendingTimeAction); setToastMessage(goingOnBreak ? "Break Started" : "Break Ended");
          }
        } catch (error) { console.error(error); setToastMessage("Action failed."); }
        setPendingTimeAction(null);
      };

      const handleCreateProject = async (e) => {
        e.preventDefault(); if (!newProjectName.trim() || !user) return;
        
        const normalizedNewName = newProjectName.trim().toLowerCase();
        if (projects.some(p => p.name.toLowerCase() === normalizedNewName)) {
           setToastMessage("Project name already exists!");
           setTimeout(() => setToastMessage(""), 3000);
           return;
        }

        try { await addDoc(collection(db, 'artifacts', appIdString, 'public', 'data', 'projects'), { name: newProjectName, description: newProjectDesc, createdBy: user.uid, status: 'Active', createdAt: serverTimestamp() }); setNewProjectName(""); setNewProjectDesc(""); setToastMessage("Project Created!"); setTimeout(() => setToastMessage(""), 3000); } 
        catch (err) { setToastMessage("Error creating project."); setTimeout(() => setToastMessage(""), 3000); }
      };

      const updateAvatar = (key, value) => { setProfileForm(prev => ({ ...prev, avatarConfig: { ...prev.avatarConfig, [key]: value } })); setUnsaved(true); };

      const CategoryBlock = ({ title, featKey }) => (
        <div className="space-y-4">
          <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest border-b border-slate-200 pb-2">{title}</p>
          <div className="flex flex-wrap gap-2">
            {AVATAR_OPTIONS[featKey].map(opt => (<button key={opt} type="button" onClick={(e) => { e.preventDefault(); updateAvatar(featKey, opt); }} className={`px-3 py-2 text-[10px] font-bold rounded-lg transition-all border-2 ${profileForm.avatarConfig[featKey] === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}`}>{opt.replace(/([A-Z])/g, ' $1').trim()}</button>))}
          </div>
        </div>
      );

      const handleGoogleLogin = async () => {
        setLoginError("Connecting to Google..."); const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
        try { 
          const result = await signInWithPopup(auth, provider); const userEmail = result.user.email || "";
          if (!userEmail.endsWith('@inventi.ph') && !userEmail.endsWith('@inventi.asia')) { await signOut(auth); setLoginError(`Access denied (${userEmail}). Please use an @inventi.ph or @inventi.asia account.`); return; }
          setLoginError("");
        } catch (error) {
          if (error.code === 'auth/unauthorized-domain') {
            setLoginError("Sandbox domain detected. Simulating @inventi.ph login...");
            try { const anonResult = await signInAnonymously(auth); const userRef = doc(db, 'artifacts', appIdString, 'public', 'data', 'profiles', anonResult.user.uid); await setDoc(userRef, { email: 'sandbox.tester@inventi.ph', lastSeen: serverTimestamp() }, { merge: true }); setLoginError(""); } 
            catch(e) { console.error(e); setLoginError("Simulated login failed."); }
          } else if (error.code === 'auth/popup-closed-by-user') { setLoginError("Login popup was closed before finishing."); } 
          else if (error.code === 'auth/network-request-failed') { setLoginError("Network error. Ensure you have an active connection."); } 
          else { console.error("Login Error:", error); setLoginError(`Login failed: ${error.message}`); }
        }
      };

      const renderMemberRow = (member) => {
        const isExpanded = expandedRosterUser === member.uid; const effStatus = getEffectiveStatus(member); const statusObj = WORK_STATUSES.find(s => s.id === effStatus) || WORK_STATUSES[0]; const StatusIcon = statusObj.icon; const proj = projects.find(p => p.id === member.activeProject);
        return (
          <div key={member.uid} className={`bg-slate-50 rounded-2xl border ${isExpanded ? 'border-indigo-300 shadow-md' : 'border-slate-100 hover:shadow-md'} transition-all cursor-pointer overflow-hidden flex flex-col`} onClick={() => setExpandedRosterUser(isExpanded ? null : member.uid)}>
             <div className="p-4 flex items-center gap-4">
               <div className="w-12 h-12 rounded-xl bg-white border-2 border-slate-100 shadow-sm flex items-center justify-center overflow-hidden shrink-0 relative"><ChibiAvatar config={member.avatarConfig} size={50} effectiveStatus={effStatus} className="translate-y-2" /></div>
               <div className="flex-1 min-w-0">
                  <h4 className="font-black text-slate-800 text-sm truncate">{member.displayName || 'Member'}</h4>
                  <div className="flex items-center gap-1.5 mt-1"><span className={`w-2 h-2 rounded-full ${member.isTimedIn ? 'bg-emerald-500' : 'bg-slate-300'}`}></span><p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider truncate">{member.isTimedIn ? `In: ${formatTime(member.lastTimeIn)}` : `Out: ${formatTime(member.lastTimeOut)}`}</p></div>
               </div>
             </div>
             {isExpanded && (
               <div className="px-5 pb-5 pt-3 border-t border-slate-100 bg-white grid grid-cols-2 gap-4 animate-in slide-in-from-top-2">
                 <div><p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Status</p><p className="text-xs font-bold text-slate-700 flex items-center gap-1 mt-1"><StatusIcon size={12} className={effStatus === 'mia' ? 'text-rose-500' : effStatus === 'break' ? 'text-orange-500' : 'text-indigo-500'}/> {statusObj.label}</p></div>
                 <div><p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Project</p><p className="text-xs font-bold text-slate-700 mt-1 truncate" title={proj ? proj.name : 'None'}>{proj ? proj.name : 'None'}</p></div>
                 <div><p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Time In</p><p className="text-xs font-bold text-slate-700 mt-1">{formatTime(member.lastTimeIn)}</p></div>
                 <div><p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Time Out</p><p className="text-xs font-bold text-slate-700 mt-1">{formatTime(member.lastTimeOut)}</p></div>
                 <div className="col-span-2 pt-2 border-t border-slate-50 flex"><button onClick={(e) => { e.stopPropagation(); setShowUserList(false); setView('office'); setSelectedUserId(member.uid); }} className="w-full text-[10px] font-black uppercase text-indigo-600 bg-indigo-50 px-3 py-2 rounded-xl hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2"><MapIcon size={14} /> Locate in Office</button></div>
               </div>
             )}
          </div>
        );
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-900 font-sans"><MapIcon className="w-16 h-16 text-indigo-400 animate-pulse" /></div>;

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-400 to-sky-200 font-sans relative overflow-hidden">
             <style>{`@keyframes fc { 0% { transform: translateX(-20vw); opacity: 0; } 10% { opacity: 0.9; } 90% { opacity: 0.9; } 100% { transform: translateX(110vw); opacity: 0; } } .c1 { animation: fc 45s linear infinite; top: 12%; } .c2 { animation: fc 60s linear infinite 15s; top: 30%; }`}</style>
             <div className="absolute inset-0 pointer-events-none"><Cloud className="absolute text-white/60 w-32 h-32 c1 -left-32" fill="currentColor" stroke="none" /><Cloud className="absolute text-white/50 w-24 h-24 c2 -left-32 scale-75" fill="currentColor" stroke="none" /></div>
             <div className="bg-white/20 backdrop-blur-2xl p-10 rounded-3xl shadow-[0_8px_32px_rgba(0,0,0,0.15)] z-10 w-full max-sm:mx-4 max-w-sm flex flex-col items-center border border-white/40">
                <div className="bg-indigo-600 p-4 rounded-2xl shadow-lg border-b-4 border-indigo-900 mb-6"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" className="text-white"><path d="M6 42H42" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/><path d="M12 42V14L24 6L36 14V42" stroke="currentColor" strokeWidth="3"/><circle cx="24" cy="20" r="4" fill="currentColor" /><circle cx="14" cy="32" r="4" fill="currentColor" /><circle cx="34" cy="32" r="4" fill="currentColor" /><path d="M17 29L21 23M31 29L27 23M18 32H30" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/></svg></div>
                <h1 className="text-4xl font-black tracking-tighter text-slate-800 mb-2 drop-shadow-sm text-center">KinHub</h1>
                <p className="text-slate-700 font-bold mb-8 text-center text-sm drop-shadow-sm px-4 uppercase tracking-tight">Close ties. Great vibes. Welcome home.</p>
                {loginError && <div className="w-full bg-amber-50/80 backdrop-blur-sm text-amber-800 p-3 rounded-xl text-[10px] font-bold mb-4 text-left border border-amber-200 flex items-start gap-2"><ShieldAlert size={16} className="shrink-0 mt-0.5" /><span className="leading-tight">{loginError}</span></div>}
                <button onClick={handleGoogleLogin} className="w-full flex items-center justify-center gap-3 bg-white/90 border border-white/60 p-4 rounded-xl font-black text-xs uppercase tracking-wider text-slate-700 shadow-sm hover:bg-white transition-all"><svg className="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Sign in with Google</button>
             </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#94a3b8] text-slate-800 flex flex-col md:flex-row overflow-hidden font-sans">
          
          {/* Global CSS for Animations & Glow Effects */}
          <style>{`
            @keyframes avatar-breathe { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
            .breathe-target { animation: avatar-breathe 3s ease-in-out infinite; animation-delay: var(--anim-delay, 0s); }
            .glow-highlight { filter: drop-shadow(0px -1px 0px #818cf8) drop-shadow(0px 1px 0px #818cf8) drop-shadow(1px 0px 0px #818cf8) drop-shadow(-1px 0px 0px #818cf8) drop-shadow(0 0 10px #4f46e5); animation: glow-pulse 1.5s infinite alternate ease-in-out; }
            @keyframes glow-pulse { 0% { filter: drop-shadow(0px -1px 0px #a5b4fc) drop-shadow(0px 1px 0px #a5b4fc) drop-shadow(1px 0px 0px #a5b4fc) drop-shadow(-1px 0px 0px #a5b4fc) drop-shadow(0 0 5px #6366f1); } 100% { filter: drop-shadow(0px -1.5px 0px #818cf8) drop-shadow(0px 1.5px 0px #818cf8) drop-shadow(1.5px 0px 0px #818cf8) drop-shadow(-1.5px 0px 0px #818cf8) drop-shadow(0 0 15px #4f46e5); } }
            .glow-red { filter: drop-shadow(0px -1px 0px #fb7185) drop-shadow(0px 1px 0px #fb7185) drop-shadow(1px 0px 0px #fb7185) drop-shadow(-1px 0px 0px #fb7185) drop-shadow(0 0 10px #e11d48); animation: glow-red-pulse 2s infinite alternate ease-in-out; }
            @keyframes glow-red-pulse { 0% { filter: drop-shadow(0px -1px 0px #fca5a5) drop-shadow(0px 1px 0px #fca5a5) drop-shadow(1px 0px 0px #fca5a5) drop-shadow(-1px 0px 0px #fca5a5) drop-shadow(0 0 5px #ef4444); } 100% { filter: drop-shadow(0px -1.5px 0px #fb7185) drop-shadow(0px 1.5px 0px #fb7185) drop-shadow(1.5px 0px 0px #fb7185) drop-shadow(-1.5px 0px 0px #fb7185) drop-shadow(0 0 15px #e11d48); } }
            @keyframes avatar-dance { 0%, 100% { transform: translateY(0px) scaleX(1); } 25% { transform: translateY(-4px) scaleX(0.95) rotate(-3deg); } 50% { transform: translateY(0px) scaleX(1); } 75% { transform: translateY(-4px) scaleX(0.95) rotate(3deg); } }
            .dancing-avatar { animation: avatar-dance 0.5s ease-in-out infinite; transform-origin: bottom center; }
            @keyframes drink-coffee { 0%, 10%, 90%, 100% { transform: rotate(0deg); } 30%, 70% { transform: rotate(-110deg); } }
            .drink-coffee-anim { animation: drink-coffee 4s ease-in-out infinite; }
            .ghost-avatar { opacity: 0.45; filter: grayscale(100%) sepia(20%) hue-rotate(180deg) drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
            .chat-scroll::-webkit-scrollbar { width: 6px; } .chat-scroll::-webkit-scrollbar-track { background: transparent; } .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } .chat-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
          `}</style>

          {!isOnboarding && (
            <nav className="hidden md:flex flex-col w-72 h-screen p-6 bg-white border-r-8 border-slate-300 z-50 shadow-2xl relative shrink-0">
              <div className="flex items-center gap-3 mb-12 mt-2"><div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg border-b-4 border-indigo-900"><Layout className="text-white h-6 w-6" /></div><span className="text-3xl font-black tracking-tighter">KinHub</span></div>
              <div className="space-y-3 flex-1 pr-2 overflow-y-auto">
                <button onClick={() => {setView('office'); setSelectedUserId(null);}} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'office' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><MapIcon size={18} /> Office</button>
                <button onClick={() => setView('projects')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'projects' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><FolderKanban size={18} /> Projects</button>
                <button onClick={() => setView('home')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'home' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><MessageSquare size={18} /> Feed</button>
                <button onClick={() => setView('directory')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'directory' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><Users size={18} /> Network</button>
                <button onClick={() => setView('profile')} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase tracking-widest ${view === 'profile' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:bg-slate-50'}`}><UserCircle size={18} /> Profile</button>
                <div className="pt-8 mt-8 border-t border-slate-100 space-y-3">
                  {user?.email === 'arkin.paroan@inventi.ph' && <button onClick={() => setShowAdmin(!showAdmin)} className={`w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase border-2 ${showAdmin ? 'bg-slate-800 text-white' : 'bg-white text-slate-500'}`}><Settings size={18} /> Zone Admin</button>}
                  <button onClick={() => signOut(auth)} className="w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-black text-xs uppercase text-red-50 hover:bg-red-50"><LogOut size={18} /> Sign Out</button>
                </div>
              </div>
            </nav>
          )}

          <main className="flex-1 relative h-screen bg-sky-200 overflow-hidden">
            {toastMessage && <div className="absolute bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] text-xs font-black uppercase transition-all animate-in slide-in-from-right-4">{toastMessage}</div>}
            
            {view === 'office' && (
              <div className="w-full h-full relative overflow-hidden">
                 <button onClick={() => setShowUserList(true)} className="absolute top-6 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-xl px-6 py-3 rounded-full shadow-lg border border-slate-200 z-40 flex items-center gap-3 hover:scale-105 transition-transform">
                   <div className="relative flex items-center justify-center"><span className="absolute w-3 h-3 bg-emerald-400 rounded-full animate-ping"></span><span className="w-2 h-2 bg-emerald-500 rounded-full z-10"></span></div>
                   <span className="font-black text-xs uppercase tracking-widest text-slate-700">{directory.filter(u => u.isTimedIn).length} / {directory.length} Online</span>
                 </button>

                 {showAdmin && (
                    <div className="absolute top-6 left-6 w-80 bg-white/95 backdrop-blur-xl p-6 rounded-[2.5rem] shadow-2xl z-50 border border-slate-200">
                       <h3 className="text-xl font-black text-slate-800 mb-6 flex items-center gap-2"><Settings className="text-indigo-500" /> Environment</h3>
                       <button onClick={handleManualSave} className="w-full py-3 bg-indigo-600 text-white rounded-xl text-xs font-black uppercase shadow-lg hover:bg-indigo-500 transition-colors">Sync Layout to Cloud</button>
                    </div>
                 )}
                 <div className="absolute top-6 right-6 z-40 bg-white p-2 rounded-2xl shadow-xl flex border border-slate-200">
                    <button onClick={() => setMapZoom(z => Math.max(0.3, z - 0.2))} className="p-3 hover:bg-slate-50 rounded-xl font-black">-</button>
                    <div className="px-4 py-3 font-black text-[10px] text-slate-400 uppercase flex items-center">Zoom</div>
                    <button onClick={() => setMapZoom(z => Math.min(3.0, z + 0.2))} className="p-3 hover:bg-slate-50 rounded-xl font-black">+</button>
                 </div>
                 
                 {/* Floating Digital Clock */}
                 <div className="absolute bottom-6 left-6 z-40 bg-white/95 backdrop-blur-xl p-5 rounded-[2rem] shadow-xl border border-slate-200 flex flex-col items-start gap-1 pointer-events-none">
                    <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">{formattedDate}</p>
                    <h2 className="text-3xl font-black text-slate-800 tracking-tighter tabular-nums">{formattedTime}</h2>
                    <p className="text-[9px] font-bold text-indigo-500 uppercase tracking-widest flex items-center gap-1 mt-1"><MapPin size={10}/> Philippine Time (PST)</p>
                 </div>

                 <MapEngine directory={directory} mapZoom={mapZoom} config={officeConfig} onSelectUser={setSelectedUserId} selectedUserId={selectedUserId} mapBgClass={mapBgClass} />
                 
                 <button onClick={() => setIsChatOpen(true)} className={`absolute bottom-6 right-6 z-40 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-[0_10px_25px_rgba(79,70,229,0.5)] hover:scale-105 hover:bg-indigo-500 transition-all ${isChatOpen ? 'hidden' : 'flex'} items-center justify-center`}><MessageCircle size={24} /></button>

                 <div className={`absolute top-0 right-0 w-[350px] sm:w-[400px] h-full bg-white/95 backdrop-blur-3xl shadow-[-20px_0_40px_rgba(0,0,0,0.1)] z-50 flex flex-col transform transition-transform duration-300 ${isChatOpen ? 'translate-x-0' : 'translate-x-full'}`} onPointerDown={e => e.stopPropagation()}>
                    <div className="p-6 border-b border-slate-100 flex items-center justify-between shrink-0">
                       <h3 className="font-black text-xl text-slate-800 tracking-tight flex items-center gap-2"><MessageCircle className="text-indigo-600"/> Team Comms</h3>
                       <button onClick={() => setIsChatOpen(false)} className="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-200 transition-colors"><X size={16} /></button>
                    </div>
                    
                    <div className="flex border-b border-slate-100 shrink-0">
                       <button onClick={() => { setChatTab('all'); setPmRecipient(null); }} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'all' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>All</button>
                       <button onClick={() => { setChatTab('dept'); setPmRecipient(null); }} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'dept' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>Dept</button>
                       <button onClick={() => setChatTab('pm')} className={`flex-1 py-4 text-[10px] font-black uppercase tracking-widest ${chatTab === 'pm' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-400 hover:bg-slate-50'}`}>PM</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 chat-scroll flex flex-col gap-4">
                       {chatTab === 'pm' && !pmRecipient ? (
                          <div className="space-y-2">
                             <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-2">Select a Colleague</p>
                             {directory.filter(u => u.uid !== user.uid).sort((a,b) => (a.displayName||'').localeCompare(b.displayName||'')).map(u => (
                                <button key={u.uid} onClick={() => setPmRecipient(u)} className="w-full flex items-center gap-4 p-3 rounded-2xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-colors text-left group">
                                   <div className="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shrink-0 group-hover:scale-110 transition-transform"><ChibiAvatar config={u.avatarConfig} size={40} className="translate-y-2" /></div>
                                   <div><h4 className="font-black text-sm text-slate-800">{u.displayName || 'Member'}</h4><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{DEPT_NAMES_LOOKUP[u.dept] || 'Explorer'}</p></div>
                                </button>
                             ))}
                          </div>
                       ) : (
                          <>
                             {chatTab === 'pm' && pmRecipient && (
                               <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-2 shrink-0">
                                  <button onClick={() => setPmRecipient(null)} className="p-2 hover:bg-white rounded-xl shadow-sm text-slate-400 transition-colors"><ChevronLeft size={16}/></button>
                                  <div><h4 className="font-black text-sm text-slate-800">Chat with {pmRecipient.displayName}</h4></div>
                               </div>
                             )}
                             {activeMessages.length === 0 ? (
                               <div className="flex-1 flex flex-col items-center justify-center text-slate-400 opacity-50"><MessageSquare size={48} className="mb-4" /><p className="font-black text-xs uppercase tracking-widest">No Messages Yet</p></div>
                             ) : (
                               activeMessages.map(msg => {
                                 const isMe = msg.senderId === user.uid;
                                 return (
                                   <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                      <div className={`max-w-[85%] rounded-2xl px-5 py-3 ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm border border-slate-200'}`}>
                                         {!isMe && <p className="text-[10px] font-black uppercase tracking-wider mb-1 opacity-50">{msg.senderName}</p>}
                                         <p className="text-sm font-medium leading-relaxed">{msg.text}</p>
                                      </div>
                                      <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1 px-1">{formatTime(msg.timestamp)}</span>
                                   </div>
                                 );
                               })
                             )}
                             <div ref={messagesEndRef} />
                          </>
                       )}
                    </div>

                    {!(chatTab === 'pm' && !pmRecipient) && (
                       <form onSubmit={handleSendMessage} className="p-4 border-t border-slate-100 bg-white shrink-0">
                          <div className="relative flex items-center">
                             <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder={chatTab === 'all' ? "Message entire company..." : chatTab === 'dept' ? `Message ${DEPT_NAMES_LOOKUP[userProfile?.dept] || 'Department'}...` : "Type private message..."} className="w-full bg-slate-50 border border-slate-200 rounded-full pl-6 pr-14 py-4 text-sm font-medium text-slate-800 outline-none focus:border-indigo-400 transition-colors shadow-inner" />
                             <button type="submit" disabled={!chatInput.trim()} className="absolute right-2 p-2 bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-500 disabled:opacity-50 disabled:hover:bg-indigo-600 transition-colors"><Send size={16} className="-ml-0.5" /></button>
                          </div>
                       </form>
                    )}
                 </div>

                 {selectedUserId && directory.find(k => k.uid === selectedUserId) && (
                   <div className="absolute right-6 top-24 w-80 bg-white/95 backdrop-blur-2xl p-6 rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.3)] z-40 border border-white/60 animate-in slide-in-from-right-8">
                     <button onClick={() => setSelectedUserId(null)} className="absolute top-6 right-6 p-2 bg-slate-100 rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-200 transition-colors"><X size={16} /></button>
                     {(() => {
                       const selUser = directory.find(k => k.uid === selectedUserId);
                       const effStatus = getEffectiveStatus(selUser);
                       const statusObj = WORK_STATUSES.find(s => s.id === effStatus) || WORK_STATUSES[0];
                       const proj = projects.find(p => p.id === selUser.activeProject);
                       const isMe = selUser.uid === user?.uid;

                       return (
                         <div className="flex flex-col items-center text-center">
                           <div className="w-28 h-28 rounded-[2rem] bg-indigo-50 flex items-center justify-center mb-4 border-4 border-white shadow-inner overflow-hidden relative">
                             <ChibiAvatar config={selUser.avatarConfig} size={110} effectiveStatus={effStatus} className="relative z-10 drop-shadow-md translate-y-6" />
                           </div>
                           <h3 className="text-xl font-black text-slate-800">{selUser.displayName || 'Kin Member'}</h3>
                           <p className="text-indigo-600 font-black uppercase text-[10px] tracking-widest mt-1 mb-6">{DEPT_NAMES_LOOKUP[selUser.dept] || 'Explorer'}</p>
                           
                           {isMe && (
                             <div className="w-full flex gap-2 mb-6">
                               {selUser?.isTimedIn ? (
                                  <>
                                    {selUser?.isOnBreak ? (
                                      <button onClick={() => requestTimeAction('BREAK_END')} className="flex-1 py-3 bg-blue-500 text-white font-black rounded-xl shadow-sm hover:bg-blue-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-[10px]"><Play size={14} /> Resume</button>
                                    ) : (
                                      <button onClick={() => requestTimeAction('BREAK_START')} className="flex-1 py-3 bg-orange-500 text-white font-black rounded-xl shadow-sm hover:bg-orange-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-[10px]"><Pause size={14} /> Pause</button>
                                    )}
                                    <button onClick={() => requestTimeAction('TIME_OUT')} className="flex-1 py-3 bg-rose-500 text-white font-black rounded-xl shadow-sm hover:bg-rose-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-[10px]"><LogOut size={14} /> Time Out</button>
                                  </>
                               ) : (
                                  <button onClick={() => requestTimeAction('TIME_IN')} className="w-full py-3 bg-emerald-500 text-white font-black rounded-xl shadow-sm hover:bg-emerald-400 transition-colors flex justify-center items-center gap-2 uppercase tracking-widest text-[10px]"><Play size={14} /> Time In</button>
                               )}
                             </div>
                           )}

                           <div className="w-full bg-slate-50 rounded-3xl p-5 mb-6 space-y-4 text-left border border-slate-100 shadow-inner">
                             <div className="flex items-center gap-3">
                               <div className="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100"><statusObj.icon size={16} className={effStatus === 'mia' ? 'text-rose-500' : effStatus === 'break' ? 'text-orange-500' : 'text-indigo-600'} /></div>
                               <div className="w-full">
                                 <p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Current Status</p>
                                 {isMe ? (
                                    <select value={selUser.workStatus || 'office'} onChange={e => handleQuickStatusUpdate('workStatus', e.target.value)} className="bg-transparent text-xs font-bold text-slate-700 outline-none cursor-pointer w-full">
                                      {WORK_STATUSES.filter(s => s.selectable).map(s => (<option key={s.id} value={s.id}>{s.label}</option>))}
                                    </select>

                                        {projects.map(p => (<option key={p.id} value={p.id}>{p.name}</option>))}
                                      </select>

                                 </div>
                               </div>

                           </div>

                           <div className="w-full space-y-3 text-left px-3">
                             <div className="flex items-center gap-4 text-slate-500 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm w-full"><Mail size={14} className="text-indigo-400 shrink-0" /> <span className="text-[11px] font-bold truncate text-slate-700">{selUser.email || 'No email provided'}</span></div>
                             <div className="flex items-center gap-4 text-slate-500 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm w-full">
                               <Phone size={14} className="text-indigo-400 shrink-0" /> 
                               {isMe ? (<input type="text" value={profileForm.contact || ''} onChange={e => { setProfileForm({...profileForm, contact: e.target.value}); setUnsaved(true); }} placeholder="Enter phone" className="bg-transparent text-[11px] font-bold text-slate-700 outline-none w-full border-b border-dashed border-slate-300 focus:border-indigo-400 transition-colors" />) : (<span className="text-[11px] font-bold text-slate-700">{selUser.contact || 'No contact provided'}</span>)}

                             <div><h2 className="text-2xl font-black text-slate-800">Office Overview</h2><p className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Directory & Attendance</p></div>
                             <div className="flex items-center gap-3">
                                <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest hidden sm:block">Group By:</span>
                                <select value={rosterGroupBy} onChange={(e) => { setRosterGroupBy(e.target.value); setExpandedRosterUser(null); }} className="bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none cursor-pointer shadow-sm focus:border-indigo-300 transition-colors"><option value="none">None</option><option value="status">Work Status</option><option value="project">Project</option></select>
                                <button onClick={() => setShowUserList(false)} className="ml-2 p-2 bg-white rounded-full text-slate-400 hover:text-slate-800 shadow-sm border border-slate-200 transition-colors"><X size={16}/></button>

                             )}
                             {rosterGroupBy === 'status' && WORK_STATUSES.map(status => {
                                const members = directory.filter(u => getEffectiveStatus(u) === status.id).sort((a,b) => (a.displayName || 'Kin').localeCompare(b.displayName || 'Kin'));

                                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{members.map(member => renderMemberRow(member))}</div>
                                   </div>
                                );
                             })}
                             {rosterGroupBy === 'project' && [{id: '', name: 'Open Work / Unassigned'}, ...projects].map(proj => {
                                const members = directory.filter(u => (u.activeProject || '') === proj.id).sort((a,b) => (a.displayName || 'Kin').localeCompare(b.displayName || 'Kin'));
                                if(members.length === 0) return null;
                                return (
                                   <div key={proj.id}>
                                      <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-3"><div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl"><FolderKanban size={18} /></div><h3 className="text-sm font-black uppercase text-slate-700 tracking-widest">{proj.name} <span className="text-slate-400 ml-2">({members.length})</span></h3></div>
                                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{members.map(member => renderMemberRow(member))}</div>
                                   </div>
                                );
                             })}
                          </div>
                       </div>
                    </div>

              </div>
            )}

            {view === 'projects' && (
              <div className="w-full h-full p-4 md:p-12 overflow-y-auto bg-slate-50">
                <div className="max-w-6xl mx-auto pb-20 animate-in slide-in-from-bottom-4 duration-500">
                  <header className="flex items-center gap-4 mb-10"><div className="bg-indigo-600 p-4 rounded-3xl shadow-lg border-b-4 border-indigo-900"><FolderKanban className="text-white w-8 h-8" /></div><div><h2 className="text-4xl font-black text-slate-800 tracking-tighter">Project Management</h2><p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1">Active Initiatives & Workstreams</p></div></header>

                      <input type="text" value={newProjectDesc} onChange={e => setNewProjectDesc(e.target.value)} placeholder="Short Description" className="flex-[2] px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-200 transition-all font-bold text-slate-700" />

                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">

                            {directory.filter(k => k.activeProject === proj.id).slice(0, 4).map((member, i) => (<div key={i} className="w-8 h-8 rounded-full border-2 border-white bg-slate-100 flex items-center justify-center overflow-hidden z-10 shadow-sm"><ChibiAvatar config={member.avatarConfig} size={32} effectiveStatus={getEffectiveStatus(member)} className="translate-y-1" /></div>))}

                        </div>
                      </div>

                    {projects.length === 0 && (<div className="col-span-full py-12 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-[3rem]"><FolderKanban size={48} className="mb-4 text-slate-300" /><p className="font-black tracking-widest uppercase">No active projects</p></div>)}
                  </div>
                </div>
              </div>
            )}

            {view === 'history' && (() => {
              const groupedLogs = timeLogs.filter(log => log.userId === user.uid).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).reduce((acc, log) => { if (!log.timestamp) return acc; const d = new Date(log.timestamp.seconds * 1000).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); if (!acc[d]) acc[d] = []; acc[d].push(log); return acc; }, {});
              return (
                <div className="w-full h-full p-4 md:p-8 overflow-y-auto bg-slate-50">
                  <div className="max-w-4xl mx-auto pb-20 animate-in slide-in-from-bottom-4 duration-500">
